name: build

on:
  push:
    branches: [main]
  pull_request:

env:
  OTA_HMAC_CI_FALLBACK: ${{ github.run_id }}

jobs:
  native:
    name: native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/pio-setup
      - name: native tests
        run: pio test -e native

  set-matrix:
    name: resolve board matrix
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.read.outputs.boards }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: read
        run: echo "boards=$(jq -c '[.[].id]' .github/boards.json)" >> "$GITHUB_OUTPUT"

  firmware:
    name: firmware
    needs: set-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.set-matrix.outputs.boards) }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/pio-setup
        with:
          espup: 'true'
          cache-suffix: ${{ matrix.board }}

      - name: Write secrets.ini
        env:
          OTA_HMAC_SECRET: ${{ secrets.OTA_HMAC_SECRET }}
        run: |
          SECRET="${OTA_HMAC_SECRET:-${OTA_HMAC_CI_FALLBACK}}"
          printf "[ota]\nhmac_secret = %s\n" "$SECRET" > secrets.ini

      - name: build (${{ matrix.board }})
        run: |
          pio run -e "${{ matrix.board }}" 2>&1 | tee build.log \
            || { echo "::error title=firmware build failed::board '${{ matrix.board }}' failed to build"; exit 1; }

      - name: flash budget gate
        run: |
          PCT=$(grep '^Flash:' build.log | grep -oE '[0-9]+\.[0-9]+%' | head -1 | tr -d '%')
          awk -v p="$PCT" 'BEGIN { exit (p > 98) ? 1 : 0 }' \
            || { echo "::error title=flash budget::board '${{ matrix.board }}' flash ${PCT}% > 98% (#305 / #158)"; exit 1; }

      - name: buildfs (${{ matrix.board }})
        run: pio run -e "${{ matrix.board }}" -t buildfs

      - name: verify spiffs round-trip
        run: |
          MKSPIFFS=$(find ~/.platformio/packages/tool-mkspiffs -name 'mkspiffs_espressif32_arduino' | head -1)
          if [ -z "$MKSPIFFS" ]; then
            echo "::error::mkspiffs binary not found"
            exit 1
          fi
          IMG=".pio/build/${{ matrix.board }}/spiffs.bin"
          if [ ! -f "$IMG" ]; then
            echo "::error::spiffs.bin not produced by buildfs for '${{ matrix.board }}'"
            exit 1
          fi
          EXTRACT=$(mktemp -d)
          "$MKSPIFFS" -u "$EXTRACT" "$IMG" > /dev/null
          (cd data && find . -type f | sort) > /tmp/src.list
          (cd "$EXTRACT" && find . -type f | sort) > /tmp/img.list
          if ! diff /tmp/src.list /tmp/img.list > /tmp/list.diff; then
            echo "::error::spiffs file list mismatch for '${{ matrix.board }}' (#1240)"
            cat /tmp/list.diff
            exit 1
          fi
          (cd data && find . -type f | sort | xargs -I{} sha256sum {}) > /tmp/src.sha
          (cd "$EXTRACT" && find . -type f | sort | xargs -I{} sha256sum {}) > /tmp/img.sha
          if ! diff /tmp/src.sha /tmp/img.sha > /tmp/sha.diff; then
            echo "::error::spiffs content mismatch for '${{ matrix.board }}'"
            cat /tmp/sha.diff
            exit 1
          fi

  secure:
    name: secure build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/pio-setup
        with:
          espup: 'true'
          cache-suffix: secure

      - name: Write secrets.ini
        env:
          OTA_HMAC_SECRET: ${{ secrets.OTA_HMAC_SECRET }}
        run: |
          SECRET="${OTA_HMAC_SECRET:-${OTA_HMAC_CI_FALLBACK}}"
          printf "[ota]\nhmac_secret = %s\n" "$SECRET" > secrets.ini

      - name: build (secure)
        run: pio run -e secure

  esp32s3:
    name: esp32s3 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/pio-setup
        with:
          espup: 'true'
          cache-suffix: esp32s3

      - name: Write secrets.ini
        env:
          OTA_HMAC_SECRET: ${{ secrets.OTA_HMAC_SECRET }}
        run: |
          SECRET="${OTA_HMAC_SECRET:-${OTA_HMAC_CI_FALLBACK}}"
          printf "[ota]\nhmac_secret = %s\n" "$SECRET" > secrets.ini

      - name: build (esp32s3)
        run: pio run -e esp32s3

  ci-success:
    name: ci-success
    needs: [native, firmware, secure, esp32s3]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: gate
        run: |
          echo "native=${{ needs.native.result }} firmware=${{ needs.firmware.result }} secure=${{ needs.secure.result }} esp32s3=${{ needs.esp32s3.result }}"
          if [ "${{ needs.native.result }}" != "success" ] \
            || [ "${{ needs.firmware.result }}" != "success" ] \
            || [ "${{ needs.secure.result }}" != "success" ] \
            || [ "${{ needs.esp32s3.result }}" != "success" ]; then
            echo "::error::one or more required CI jobs failed — see the failing job above"
            exit 1
          fi

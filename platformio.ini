; dash-firmware — PlatformIO project configuration
; Target: Elecrow CrowPanel 2.8" ESP32 (ILI9341 320x240 + XPT2046 touch)
; Framework: Arduino
; See include/board_config.h for hardware pin assignments

[platformio]
default_envs = crowpanel_28
; extra_scripts must live in an [env:*] section — PlatformIO ignores it here.
; The script (scripts/extra_targets.py) injects APP_VERSION_STR from
; canshift-firmware/package.json and CONFIG_SCHEMA_VERSION from canshift-core.

; ---------------------------------------------------------------------------
; Shared build flags — inherited by all environments
; ---------------------------------------------------------------------------
[base_flags]
build_flags =
    ; LVGL — explicitly add include/ to the search path so LVGL's __has_include
    ; finds lv_conf.h even when compiling library code.
    ; LV_CONF_INCLUDE_SIMPLE triggers #include "lv_conf.h" inside LVGL.
    ; -I src lets LVGL resolve LV_ASSERT_HANDLER_INCLUDE = "diag/lvgl_assert.h".
    -DLV_CONF_INCLUDE_SIMPLE=1
    -I include
    -I src

    ; Warning gates (issue #892). -Wall + -Wextra catch the common foot-guns;
    ; -Wno-unused-parameter silences the LVGL event-cb prototype noise where
    ; we genuinely don't read the lv_event_t arg. Native env opts into
    ; -Werror as the first ratchet step; prod stays warn-only until the
    ; tree is clean across all toolchains.
    -Wall
    -Wextra
    -Wno-unused-parameter

    ; LovyanGFX — panel + bus + touch + backlight all configured via the
    ; custom LGFX class in include/lgfx_panel.h (no -D flags needed).

    ; ArduinoJson v7 is enforced via lib_deps (bblanchon/ArduinoJson @ ^7.2.0).

    ; Framework WiFi headers — needed by arduinoWebSockets which is now in
    ; the default lib_deps (crowpanel_28). The PIO LDF resolves WiFi.h /
    ; WiFiClientSecure.h for user sources via the framework's bundled
    ; libraries, but library-internal compile commands don't inherit the
    ; user-project include path. Exposed at base level so debug / sim /
    ; secure envs (which inherit lib_deps from crowpanel_28 but reset
    ; build_flags) can compile WebSockets too.
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/WiFi/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32/libraries/WiFiClientSecure/src

    ; FreeRTOS task stack sizes (bytes)
    -DTASK_STACK_UI=8192
    -DTASK_STACK_CAN=4096
    -DTASK_STACK_USB=4096

    ; Arduino loopTask stack — runs setup() including the full boot sequence
    ; (LVGL init, FontManager, page build with logging). Default 8192 trips
    ; the stack canary inside vsnprintf during Logger::emit when boot logs a
    ; longer message at depth. 16 KB is comfortable headroom.
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384

    ; Enable C++17
    -std=gnu++17

    ; OTA bootloader rollback — treat each freshly-flashed slot as
    ; ESP_OTA_IMG_PENDING_VERIFY until firmware calls
    ; esp_ota_mark_app_valid_cancel_rollback() after a stable boot. If the
    ; new app crashes before the mark call, the bootloader rolls back to the
    ; previously-known-good slot on next reset. See src/boot/boot_sequence.cpp
    ; for the runtime mark call (issue #674).
    ; NOTE: arduino-esp32 5.4.0 ships a prebuilt bootloader; the runtime mark
    ; API works regardless, and this flag documents intent + takes effect on
    ; any future custom-bootloader build (e.g. via sdkconfig.defaults).
    -DCONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=1

; ---------------------------------------------------------------------------
; Production environment — CrowPanel 2.8"
; ---------------------------------------------------------------------------
[env:crowpanel_28]
platform    = espressif32@5.4.0
board       = esp32dev
framework   = arduino
extra_scripts = scripts/extra_targets.py, scripts/build_rust.py

; Serial monitor — DTR/RTS held low so opening the monitor auto-resets the
; ESP32 (CH340 auto-reset circuit). Without this, boot logs are missed
; because the monitor opens after the chip has already booted.
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
monitor_dtr     = 0
monitor_rts     = 0

; Partition scheme — dual OTA + SPIFFS.
; app0/app1 = 1536 KB each, spiffs = 832 KB, coredump = 128 KB. See
; ota_4mb.csv. The WiFi-extended variant (ota_4mb_wifi.csv, 1728 KB slots
; sized to fit the SPA bundle) was retired alongside the WiFi+SPA removal
; (#1351). SPIFFS offset returns to 0x310000.
; Existing field devices carrying a pre-#1351 image must be USB-reflashed
; via the Tuner — OTA between the WiFi-extended layout and this one is
; unsafe because the bootloader-visible partition table changes shape.
board_build.partitions = ota_4mb.csv
board_build.filesystem = spiffs

; Embed the default dashboard / signals / theme JSON + the 7 SPIFFS-resident
; Orbitron .bin fonts into the firmware so first boot on a freshly-flashed
; device (and OTA upgrades that replace only the app partition) can provision
; SPIFFS without the user having to run `pio run -t uploadfs` first.
; The two primary (Black 32 + 48) sizes ship in-flash as compiled C arrays
; (src/ui/fonts/lv_font_orbitron_black_{32,48}_nk.c) instead — the 80 KB LVGL
; pool cannot host the 43 KB 48 px Black on top of the draw buffers.
; Linker exposes _binary_<munged_path>_start / _end symbols per file —
; src/config/default_config.cpp pulls in the JSON, src/boot/default_fonts.cpp
; pulls in the .bin fonts (issues #173 + #467 + #487 + #664).
board_build.embed_files =
    data/config/dashboard.json
    data/fonts/orbitron_bold_20.bin
    data/fonts/orbitron_bold_24.bin
    data/fonts/orbitron_medium_8.bin
    data/fonts/orbitron_medium_10.bin
    data/fonts/orbitron_medium_12.bin
    data/fonts/orbitron_medium_14.bin
    data/fonts/orbitron_medium_16.bin

; Upload settings — 115200 baud, standard stub. We previously forced
; --no-stub after seeing "Failed to communicate with the flash chip", but
; that turned out to be the auto-reset failing (CH340 + EN/IO0 timing on
; this board) rather than a stub issue. --no-stub didn't actually fix that
; and slowed every flash. --connect-attempts retries the DTR/RTS reset
; sequence when the first cycle misses the bootloader-entry window — fixes
; the "had to physically hold BOOT" pain on this CH340 (#49). If the retry
; loop still misbehaves, the durable hardware fix is a 0.1 µF cap between
; EN and GND.
upload_speed   = 115200
upload_flags   =
    --before=default_reset
    --after=hard_reset
    --connect-attempts=5

; Strip framework default -Os so our -O2 below actually wins (last -O wins
; in GCC, but PlatformIO appends user flags before framework flags here).
build_unflags = -Os

build_flags =
    ${base_flags.build_flags}
    ; Board selection — picked up by include/board.h to load the matching
    ; board profile from include/boards/<board>.h.
    -DBOARD_CROWPANEL_28=1

    ; CORE_DEBUG_LEVEL=1 (errors only) — drops every framework log_i / log_w
    ; format string baked in by arduino-esp32 + LovyanGFX + NimBLE. Saves
    ; ~4-7 KB flash. Our app logs go through Logger::emit() (gated by
    ; APP_LOG_LEVEL) and are unaffected. To debug a framework-level issue,
    ; switch a user to [env:debug] (level 5). Issue #408.
    -DCORE_DEBUG_LEVEL=1

    ; -O2 for production: ~5-10% UI throughput vs default -Os.
    ; -Os was tried for flash savings but the arduino-esp32 5.4.0 toolchain
    ; eliminates `fs::FileImpl` vtable under -Os, breaking link
    ; (`undefined reference to vtable for fs::FileImpl`). Future workaround:
    ; explicit `template class fs::FileImpl;` in a TU, or framework upgrade.
    ; LTO disabled: arduino-esp32 5.4.0 toolchain ld lacks the LTO linker
    ; plugin and drops app_main from libfreertos.a, breaking link.
    -O2

    ; NimBLE memory + flash footprint reduction.
    ; Peripheral-only role: disable central/observer/broadcaster/mesh (unused).
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=1
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=4
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=0
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=0
    -DCONFIG_BT_NIMBLE_MESH_ENABLED=0
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=4

    ; PSRAM — enable the IDF PSRAM init so WROVER variants of the CrowPanel
    ; 2.8" module light up automatically. On a WROOM chip with no PSRAM the
    ; init fails silently and ESP.getPsramSize() returns 0 — handled by the
    ; runtime detect in src/hal/memory/psram.cpp (issue #563). The cache-issue
    ; workaround is mandatory for rev 1 silicon and harmless on rev 3+.
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

    ; USB tick trace retired — #976 hasn't reproduced since the post-#1051
    ; WDT subscription fix landed. Drop the flag to claw back ~1.5 KB flash.
    ; Re-enable temporarily if a USB-related panic recurs in the field.

    -DUSE_RUST_OTA_HMAC=1
    -DUSE_RUST_SIGNAL_MAP=1
    -DUSE_RUST_CAN_PARSER=1
    -DUSE_RUST_USB_ENVELOPE=1
    -DUSE_RUST_CONFIG_LOADER=1
    -DUSE_RUST_FORMAT_FLOAT=1
    -DUSE_RUST_ERROR_STORE=1
    -DUSE_RUST_ALERT_ENGINE=1
    -DUSE_RUST_SENSOR_COLOR_RAMP=1
    -DUSE_RUST_TIMER_CORE=1
    -Wl,-z,muldefs

; Libraries
lib_deps =
    ; LVGL 8.3 — stable release for ESP32
    lvgl/lvgl @ ^8.3.11

    ; LovyanGFX — display + touch driver (Elecrow-recommended for CrowPanel)
    lovyan03/LovyanGFX @ ^1.1.16

    ; ArduinoJson v7
    bblanchon/ArduinoJson @ ^7.2.0

    ; NimBLE — compact BLE stack for ESP32 (~200KB vs 500KB for Bluedroid)
    ; Used for mobile app telemetry stream and settings sync
    h2zero/NimBLE-Arduino @ ^1.4.3

lib_ldf_mode = deep+

; ---------------------------------------------------------------------------
; Debug environment — verbose logging, slow upload
; ---------------------------------------------------------------------------
[env:debug]
extends      = env:crowpanel_28
build_unflags = -DCORE_DEBUG_LEVEL=1
; Inherits the full crowpanel_28 flag set — rebuilding from base_flags alone
; drops the USE_RUST_* flags and the link fails because the C++ sources call
; the Rust FFI unconditionally (#1762).
build_flags =
    ${env:crowpanel_28.build_flags}
    -DAPP_DEBUG_BUILD=1
    -DCORE_DEBUG_LEVEL=5
upload_speed = 115200

; ---------------------------------------------------------------------------
; UI profiling environment — production logging level, but with the
; perf-counters module compiled in (APP_PROFILE_UI=1) so the firmware emits
; a 1 Hz PERF summary line and the LVGL on-screen FPS overlay appears.
; Use this profile to measure touch responsiveness on the real board
; (issue #95).
; ---------------------------------------------------------------------------
[env:debug-perf]
extends      = env:crowpanel_28
build_unflags = -DCORE_DEBUG_LEVEL=1
build_flags =
    ${base_flags.build_flags}
    -DBOARD_CROWPANEL_28=1
    -DCORE_DEBUG_LEVEL=3
    -DAPP_PROFILE_UI=1

    ; Same NimBLE trims as production so the build matches what runs on the
    ; user's device.
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=1
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=4
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=0
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=0
    -DCONFIG_BT_NIMBLE_MESH_ENABLED=0
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=4

    -O2

; ---------------------------------------------------------------------------
; Native unit-test environment — compiles a subset of the firmware sources
; against host-only shims (test/native/shim/) so the parsers and signal store
; can be exercised on the dev machine without an ESP32. Run with:
;   pio test -e native
;
; The shim include path goes BEFORE include/ and src/ so production headers
; like Arduino.h, freertos/FreeRTOS.h, hal/storage/storage_driver.h, and
; diag/logger.h resolve to the host-friendly versions during this build only.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_type = debug
extra_scripts = scripts/build_rust_native.py
build_flags =
    -std=gnu++17
    -DUNIT_TEST=1
    -DBOARD_CROWPANEL_28=1
    -DCONFIG_SCHEMA_VERSION=\"1.0.0\"
    -I test/native/shim
    -I include
    -I src
    ; First ratchet step (issue #892): native is the cleanest target, so
    ; promote warnings to errors here. Prod (crowpanel_28) stays warn-only
    ; until the rest of the tree is audited; flip there in a follow-up PR.
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Werror
    ; ASan+UBSan on native tests catches UB / memory bugs in pure-logic
    ; modules; sanitizers don't work on Xtensa target so this is the only
    ; place we can run them. -O1 keeps sanitizers effective without crushing
    ; build speed; -fno-sanitize-recover=all makes the test binary abort on
    ; the first finding so CI fails loudly instead of warning-and-continuing.
    ;
    ; LeakSanitizer is intentionally not in `-fsanitize=...` because the flag
    ; isn't portable: on Linux ASan already runs LSan at process exit so we
    ; get leak coverage for free in CI; on macOS standalone `leak` is rejected
    ; by Apple clang and breaks `pio test` locally. ASAN_OPTIONS=detect_leaks=1
    ; (set in the CI step) is the portable knob if we ever need to flip it on
    ; explicitly — see issue #936 Phase 0 notes.
    -O1
    -g
    -fsanitize=address,undefined
    -fno-omit-frame-pointer
    -fno-sanitize-recover=all
build_unflags =
    -O0
; -fsanitize must reach the linker too — PlatformIO forwards build_flags to
; both compile and link for the native platform, so no separate link option
; is needed (and link_flags is not a recognized PlatformIO key).
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
test_build_src = yes
build_src_filter =
    -<*>
    +<config/config_loader.cpp>
    +<config/json_reader.cpp>
    +<runtime/signal_store.cpp>
    +<can/can_parser.cpp>
    +<can/signal_map.cpp>
    +<ui/screen_profile.cpp>
    +<ui/sensor_color_ramp.cpp>
    +<ui/sensor_palette.cpp>
    +<ui/top_bar_separator_link.cpp>
    +<hal/usb/usb_dispatch_validation.cpp>
    +<diag/error_store.cpp>
    +<diag/logger.cpp>
    +<hal/usb/usb_envelope.cpp>
    +<hal/wifi/ota_hmac.cpp>
    +<hal/wifi/sw_sha256.cpp>
    +<util/format_float.cpp>
    +<../test/native/shim/hal/storage/storage_driver_fake.cpp>

; ---------------------------------------------------------------------------
; Secure-boot-v2 + flash-encryption environment — OPT-IN, PRODUCTION ONLY
; ---------------------------------------------------------------------------
; This env builds a signed image suitable for chips that have been (or will
; be) provisioned with secure boot v2 + flash encryption via the one-time
; first-flash procedure documented in docs/secure-boot-setup.md.
;
; Building this env requires `secrets/secure_boot_signing_key.pem` to exist
; (generate it once via scripts/generate_keys.sh). The signing key is
; per-project, off-Git, and the single most security-critical artifact in
; the project — losing it freezes every fielded device on its current image.
;
; DO NOT FLASH THE OUTPUT TO A DEV BOARD with `pio run -e secure -t upload`
; on a chip that already has secure boot enabled — the upload will be
; plaintext, FLASH_CRYPT_CNT will increment, and the chip will eventually
; refuse to boot. Use scripts/secure_boot_first_flash.sh for fused chips.
;
; sdkconfig overrides (applied via sdkconfig.defaults.secure):
;   CONFIG_SECURE_BOOT_V2_ENABLED=y
;   CONFIG_SECURE_SIGNED_APPS_RSA_SCHEME=y
;   CONFIG_SECURE_BOOT_SIGNING_KEY="secrets/secure_boot_signing_key.pem"
;   CONFIG_FLASH_ENCRYPTION_ENABLED=y
;   CONFIG_SECURE_FLASH_ENC_ENABLED=y
;   CONFIG_SECURE_FLASH_ENCRYPTION_MODE_RELEASE=y
;   CONFIG_BOOTLOADER_APP_ANTI_ROLLBACK=y
[env:secure]
extends                 = env:crowpanel_28
board_build.partitions  = ota_4mb_secure.csv
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.secure
build_flags =
    ${env:crowpanel_28.build_flags}
    -DAPP_SECURE_BOOT_BUILD=1

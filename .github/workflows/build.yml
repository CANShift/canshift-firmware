name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.12'
  CLANG_FORMAT_VERSION: '22.1.8'
  RUFF_VERSION: '0.17.0'
  ACTIONLINT_VERSION: '1.7.12'
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  SHELLCHECK_VERSION: '0.11.0'
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
  PRETTIER_VERSION: '3.9.6'

jobs:
  native:
    name: native tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The host static libs are x86; the workspace pins the Espressif fork for
    # the xtensa target only, and this job never installs espup.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pio-setup
      - name: native tests
        run: pio test -e native

  set-matrix:
    name: resolve board matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      boards: ${{ steps.read.outputs.boards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        run: echo "boards=$(jq -c '[.[].id]' .github/boards.json)" >> "$GITHUB_OUTPUT"

  firmware:
    name: firmware
    needs: set-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.set-matrix.outputs.boards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/pio-setup
        with:
          espup: 'true'
          cache-suffix: ${{ matrix.board }}

      - name: build (${{ matrix.board }})
        run: |
          pio run -e "${{ matrix.board }}" 2>&1 | tee build.log \
            || { echo "::error title=firmware build failed::board '${{ matrix.board }}' failed to build"; exit 1; }

      - name: link invariants
        run: python3 scripts/check_link_invariants.py ".pio/build/${{ matrix.board }}/firmware.map"

      - name: flash budget gate
        run: |
          PCT=$(grep '^Flash:' build.log | grep -oE '[0-9]+\.[0-9]+%' | head -1 | tr -d '%')
          awk -v p="$PCT" 'BEGIN { exit (p > 98) ? 1 : 0 }' \
            || { echo "::error title=flash budget::board '${{ matrix.board }}' flash ${PCT}% > 98% (#305 / #158)"; exit 1; }

      - name: buildfs (${{ matrix.board }})
        run: pio run -e "${{ matrix.board }}" -t buildfs

      - name: verify spiffs round-trip
        run: |
          MKSPIFFS=$(find ~/.platformio/packages/tool-mkspiffs -name 'mkspiffs_espressif32_arduino' | head -1)
          if [ -z "$MKSPIFFS" ]; then
            echo "::error::mkspiffs binary not found"
            exit 1
          fi
          IMG=".pio/build/${{ matrix.board }}/spiffs.bin"
          STAGED=".pio/build/${{ matrix.board }}/spiffs_data"
          if [ ! -f "$IMG" ]; then
            echo "::error::spiffs.bin not produced by buildfs for '${{ matrix.board }}'"
            exit 1
          fi
          EXTRACT=$(mktemp -d)
          "$MKSPIFFS" -u "$EXTRACT" "$IMG" > /dev/null
          (cd "$STAGED" && find . -type f | sort) > /tmp/src.list
          (cd "$EXTRACT" && find . -type f | sort) > /tmp/img.list
          if ! diff /tmp/src.list /tmp/img.list > /tmp/list.diff; then
            echo "::error::spiffs file list mismatch for '${{ matrix.board }}' (#1240)"
            cat /tmp/list.diff
            exit 1
          fi
          (cd "$STAGED" && find . -type f | sort | xargs -I{} sha256sum {}) > /tmp/src.sha
          (cd "$EXTRACT" && find . -type f | sort | xargs -I{} sha256sum {}) > /tmp/img.sha
          if ! diff /tmp/src.sha /tmp/img.sha > /tmp/sha.diff; then
            echo "::error::spiffs content mismatch for '${{ matrix.board }}'"
            cat /tmp/sha.diff
            exit 1
          fi

  secure:
    name: secure build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/pio-setup
        with:
          espup: 'true'
          cache-suffix: secure

      - name: build (secure)
        run: pio run -e secure

  diagnostic:
    name: diagnostic builds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pio-setup
        with:
          espup: 'true'
          cache-suffix: diagnostic
      - name: build with every diagnostic flag on
        run: |
          pio run -e debug-perf \
            || { echo "::error title=diagnostic build failed::code behind APP_PROFILE_UI / APP_USB_TICK_TRACE / APP_LV_TASK_LOG no longer compiles (#109)"; exit 1; }
      - name: build with BLE disabled
        run: |
          PLATFORMIO_BUILD_FLAGS="-DAPP_BLE_ENABLED=0" pio run -e debug \
            || { echo "::error title=BLE-disabled build failed::code guarded by APP_BLE_ENABLED no longer compiles without it"; exit 1; }

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: clang-format
        run: |
          pip install "clang-format==${CLANG_FORMAT_VERSION}"
          find src include test sim \( -name "*.cpp" -o -name "*.h" -o -name "*.inc" \) \
            ! -name 'lv_conf.h' ! -path 'test/native/vendor/*' -print0 \
            | xargs -0 clang-format --dry-run --Werror --style=file
      - name: FFI constant parity
        run: python3 scripts/check_ffi_parity.py
      - name: Release envs keep OTA signature checks
        run: python3 scripts/check_release_flags.py
      - name: Board lists agree
        run: python3 scripts/check_board_lists.py
      - name: Display tiers agree
        run: python3 scripts/check_display_tiers.py
      - name: Release manifest builds
        run: python3 scripts/build_manifest.py v0.0.0-lint 0.0.0-lint > /dev/null

  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The workspace pins the Espressif fork for the xtensa target; the host
    # test and lint pass needs neither, so it runs on stable without espup.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: cargo test
        run: cargo test --workspace --all-features
        working-directory: rust
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        working-directory: rust
      - name: cargo fmt
        run: cargo fmt --all --check
        working-directory: rust

  scripts:
    name: scripts and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install actionlint and shellcheck
        run: |
          BIN="$RUNNER_TEMP/bin"
          mkdir -p "$BIN"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz -C "$BIN" actionlint
          curl -fsSL --retry 3 -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum --check --strict
          tar -xJf shellcheck.tar.xz -C "$BIN" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$BIN" >> "$GITHUB_PATH"
      - name: actionlint
        run: |
          shellcheck --version | grep -qx "version: ${SHELLCHECK_VERSION}"
          actionlint
      - name: shellcheck
        run: |
          shellcheck -S error scripts/*.sh scripts/hooks/*.sh
          shellcheck -S error -s sh .husky/pre-commit
      - name: ruff
        run: |
          pip install "ruff==${RUFF_VERSION}"
          ruff check .
      - name: prettier (yaml)
        run: npx --yes "prettier@${PRETTIER_VERSION}" --check "**/*.{yml,yaml}"

  ci-success:
    name: ci-success
    needs: [native, set-matrix, firmware, secure, diagnostic, lint, rust, scripts]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          if ! echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null; then
            echo "::error::one or more required CI jobs did not succeed — see the job list above"
            exit 1
          fi

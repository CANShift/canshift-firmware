name: lint

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: '3.12'
  OTA_HMAC_CI_FALLBACK: ${{ github.run_id }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: clang-format
        run: |
          FILES=$(find src include -name "*.cpp" -o -name "*.h" | grep -v 'lv_conf\.h')
          clang-format --dry-run --Werror --style=file $FILES

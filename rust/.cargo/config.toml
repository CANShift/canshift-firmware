# .cargo/config.toml — Workspace cargo settings for the firmware Rust spike.
#
# `build-std` is NOT set globally — that would force core + alloc to rebuild
# for every host `cargo test`. The PlatformIO build script passes
# `-Z build-std=core,alloc` explicitly when targeting Xtensa.
#
# build-std-features = [] is set here (not via CLI, where `-Z bsf=` parses
# as `[""]` not as the empty list). Default is ["compiler-builtins-mem"]
# which exposes memcpy/memmove/memset as weak C-ABI symbols — those
# collide with ESP-IDF's IRAM-resident versions and cause a boot-time
# crash in `read_id_core` before flash cache is enabled. Disabling the
# feature keeps compiler_builtins for Rust internals (mangled) but stops
# the unmangled exports.

[unstable]
build-std-features = []

[target.xtensa-esp32-none-elf]
rustflags = []

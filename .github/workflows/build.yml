name: build

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: '3.12'
  OTA_HMAC_CI_FALLBACK: ${{ github.run_id }}

jobs:
  build:
    name: build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/.packages
            .pio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/**/Cargo.toml', 'rust/**/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install espup + esp32 Rust toolchain
        run: |
          if ! command -v espup >/dev/null; then
            cargo install espup --locked
          fi
          espup install --targets esp32
          . ~/export-esp.sh
          echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"
          for dir in $(echo "$PATH" | tr ':' '\n' | grep -E '(esp|rustup)' || true); do
            echo "$dir" >> "$GITHUB_PATH"
          done

      - name: Install PlatformIO
        run: pip install platformio

      - name: Write secrets.ini
        env:
          OTA_HMAC_SECRET: ${{ secrets.OTA_HMAC_SECRET }}
        run: |
          SECRET="${OTA_HMAC_SECRET:-${OTA_HMAC_CI_FALLBACK}}"
          printf "[ota]\nhmac_secret = %s\n" "$SECRET" > secrets.ini

      - name: native tests
        run: pio test -e native

      - name: build (crowpanel_28)
        run: pio run -e crowpanel_28 2>&1 | tee build.log

      - name: flash budget gate
        run: |
          PCT=$(grep '^Flash:' build.log | grep -oE '[0-9]+\.[0-9]+%' | head -1 | tr -d '%')
          awk -v p="$PCT" 'BEGIN { exit (p > 98) ? 1 : 0 }' \
            || (echo "::error::flash ${PCT}% > 98% (#305 / #158)" && exit 1)

      - name: buildfs (crowpanel_28)
        run: pio run -e crowpanel_28 -t buildfs

      - name: verify spiffs round-trip
        run: |
          MKSPIFFS=$(find ~/.platformio/packages/tool-mkspiffs -name 'mkspiffs_espressif32_arduino' | head -1)
          if [ -z "$MKSPIFFS" ]; then
            echo "::error::mkspiffs binary not found"
            exit 1
          fi
          IMG=.pio/build/crowpanel_28/spiffs.bin
          if [ ! -f "$IMG" ]; then
            echo "::error::spiffs.bin not produced by buildfs"
            exit 1
          fi
          EXTRACT=$(mktemp -d)
          "$MKSPIFFS" -u "$EXTRACT" "$IMG" > /dev/null
          (cd data && find . -type f | sort) > /tmp/src.list
          (cd "$EXTRACT" && find . -type f | sort) > /tmp/img.list
          if ! diff /tmp/src.list /tmp/img.list > /tmp/list.diff; then
            echo "::error::spiffs file list mismatch (#1240)"
            cat /tmp/list.diff
            exit 1
          fi
          (cd data && find . -type f | sort | xargs -I{} sha256sum {}) > /tmp/src.sha
          (cd "$EXTRACT" && find . -type f | sort | xargs -I{} sha256sum {}) > /tmp/img.sha
          if ! diff /tmp/src.sha /tmp/img.sha > /tmp/sha.diff; then
            echo "::error::spiffs content mismatch"
            cat /tmp/sha.diff
            exit 1
          fi

      - name: build (secure)
        run: pio run -e secure

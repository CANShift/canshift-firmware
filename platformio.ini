; dash-firmware — PlatformIO project configuration
; Target: Elecrow CrowPanel 2.8" ESP32 (ILI9341 320x240 + XPT2046 touch)
; Framework: Arduino
; See include/board_config.h for hardware pin assignments

[platformio]
default_envs = crowpanel_28
; extra_scripts must live in an [env:*] section — PlatformIO ignores it here.
; The script (scripts/extra_targets.py) injects APP_VERSION_STR from
; canshift-studio/package.json and CONFIG_SCHEMA_VERSION from canshift-core.

; ---------------------------------------------------------------------------
; Shared build flags — inherited by all environments
; ---------------------------------------------------------------------------
[base_flags]
build_flags =
    ; LVGL — explicitly add include/ to the search path so LVGL's __has_include
    ; finds lv_conf.h even when compiling library code.
    ; LV_CONF_INCLUDE_SIMPLE triggers #include "lv_conf.h" inside LVGL.
    ; -I src lets LVGL resolve LV_ASSERT_HANDLER_INCLUDE = "diag/lvgl_assert.h".
    -DLV_CONF_INCLUDE_SIMPLE=1
    -I include
    -I src

    ; LovyanGFX — panel + bus + touch + backlight all configured via the
    ; custom LGFX class in include/lgfx_panel.h (no -D flags needed).

    ; ArduinoJson v7 is enforced via lib_deps (bblanchon/ArduinoJson @ ^7.2.0).

    ; FreeRTOS task stack sizes (bytes)
    -DTASK_STACK_UI=8192
    -DTASK_STACK_CAN=4096
    -DTASK_STACK_USB=4096
    -DTASK_STACK_SIM=2048

    ; Arduino loopTask stack — runs setup() including the full boot sequence
    ; (LVGL init, FontManager, page build with logging). Default 8192 trips
    ; the stack canary inside vsnprintf during Logger::emit when boot logs a
    ; longer message at depth. 16 KB is comfortable headroom.
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384

    ; Enable C++17
    -std=gnu++17

; ---------------------------------------------------------------------------
; Production environment — CrowPanel 2.8"
; ---------------------------------------------------------------------------
[env:crowpanel_28]
platform    = espressif32@5.4.0
board       = esp32dev
framework   = arduino
extra_scripts = scripts/extra_targets.py

; Serial monitor — DTR/RTS held low so opening the monitor auto-resets the
; ESP32 (CH340 auto-reset circuit). Without this, boot logs are missed
; because the monitor opens after the chip has already booted.
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
monitor_dtr     = 0
monitor_rts     = 0

; Partition scheme — dual OTA + SPIFFS (required for mobile OTA)
; app0/app1 = 1.3 MB each, spiffs = 1.2 MB
board_build.partitions = ota_4mb.csv
board_build.filesystem = spiffs

; Embed the default dashboard / signals / theme JSON + the 6 Orbitron .bin
; fonts into the firmware so first boot on a freshly-flashed device (and
; OTA upgrades that replace only the app partition) can provision SPIFFS
; without the user having to run `pio run -t uploadfs` first.
; Linker exposes _binary_<munged_path>_start / _end symbols per file —
; src/config/default_config.cpp pulls in the JSON, src/boot/default_fonts.cpp
; pulls in the .bin fonts (issues #173 + #467 + #487).
board_build.embed_files =
    data/config/dashboard.json
    data/config/signals.json
    data/config/theme.json
    data/fonts/orbitron_black_32.bin
    data/fonts/orbitron_bold_20.bin
    data/fonts/orbitron_bold_24.bin
    data/fonts/orbitron_medium_12.bin
    data/fonts/orbitron_medium_14.bin
    data/fonts/orbitron_medium_16.bin

; Upload settings — 115200 baud, standard stub. We previously forced
; --no-stub after seeing "Failed to communicate with the flash chip", but
; that turned out to be the auto-reset failing (CH340 + EN/IO0 timing on
; this board) rather than a stub issue. --no-stub didn't actually fix that
; and slowed every flash. If --before/--after auto-reset still misbehaves,
; the durable fix is a 0.1 µF cap between EN and GND (issue #49).
upload_speed   = 115200

; Strip framework default -Os so our -O2 below actually wins (last -O wins
; in GCC, but PlatformIO appends user flags before framework flags here).
build_unflags = -Os

build_flags =
    ${base_flags.build_flags}
    ; Board selection — picked up by include/board.h to load the matching
    ; board profile from include/boards/<board>.h.
    -DBOARD_CROWPANEL_28=1

    ; CORE_DEBUG_LEVEL=1 (errors only) — drops every framework log_i / log_w
    ; format string baked in by arduino-esp32 + LovyanGFX + NimBLE. Saves
    ; ~4-7 KB flash. Our app logs go through Logger::emit() (gated by
    ; APP_LOG_LEVEL) and are unaffected. To debug a framework-level issue,
    ; switch a user to [env:debug] (level 5). Issue #408.
    -DCORE_DEBUG_LEVEL=1

    ; -O2 for production: ~5-10% UI throughput vs default -Os.
    ; LTO disabled: arduino-esp32 5.4.0 toolchain ld lacks the LTO linker
    ; plugin and drops app_main from libfreertos.a, breaking link.
    -O2

    ; NimBLE memory + flash footprint reduction.
    ; Peripheral-only role: disable central/observer/broadcaster/mesh (unused).
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=1
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=4
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=0
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=0
    -DCONFIG_BT_NIMBLE_MESH_ENABLED=0
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=4

; Libraries
lib_deps =
    ; LVGL 8.3 — stable release for ESP32
    lvgl/lvgl @ ^8.3.11

    ; LovyanGFX — display + touch driver (Elecrow-recommended for CrowPanel)
    lovyan03/LovyanGFX @ ^1.1.16

    ; ArduinoJson v7
    bblanchon/ArduinoJson @ ^7.2.0

    ; NimBLE — compact BLE stack for ESP32 (~200KB vs 500KB for Bluedroid)
    ; Used for mobile app telemetry stream and settings sync
    h2zero/NimBLE-Arduino @ ^1.4.3

lib_ldf_mode = deep+

; ---------------------------------------------------------------------------
; Example alternate board — reference template for adding a new HMI panel.
; This block is commented out: it documents the wiring needed when porting
; CANShift to a different ESP32 display board. Uncomment + customize.
; See include/boards/_example_alt_board.h for the matching header skeleton.
; ---------------------------------------------------------------------------
; [env:example_alt_board]
; platform    = espressif32@5.4.0
; board       = esp32dev
; framework   = arduino
; extra_scripts = scripts/extra_targets.py
; board_build.partitions = ota_4mb.csv
; board_build.filesystem = spiffs
; build_unflags = -Os
; build_flags =
;     ${base_flags.build_flags}
;     -DBOARD_EXAMPLE_ALT=1
;     -DCORE_DEBUG_LEVEL=1
;     -O2

; ---------------------------------------------------------------------------
; Simulation environment — build with SIM mode ON, no hardware required
; Useful for CI and UI development without the physical board
; ---------------------------------------------------------------------------
[env:sim]
extends      = env:crowpanel_28
; Pin CPU to 160 MHz so the QEMU smoke test doesn't hang in arduino-esp32's
; 80→240 MHz PLL bump (Espressif QEMU through 9.2.2 doesn't model that
; transition). Sim/QEMU only — production env stays at 240 MHz.
board_build.f_cpu = 160000000L
build_unflags = -DCORE_DEBUG_LEVEL=1
build_flags =
    ${base_flags.build_flags}
    -DBOARD_CROWPANEL_28=1
    -DAPP_SIMULATION_MODE=1
    -DAPP_BLE_ENABLED=0
    -DCORE_DEBUG_LEVEL=4
    -DCONFIG_ESP32_DEFAULT_CPU_FREQ_MHZ=160
    -DCONFIG_ESP32_DEFAULT_CPU_FREQ_160=1

; ---------------------------------------------------------------------------
; Debug environment — verbose logging, slow upload
; ---------------------------------------------------------------------------
[env:debug]
extends      = env:crowpanel_28
build_unflags = -DCORE_DEBUG_LEVEL=1
build_flags =
    ${base_flags.build_flags}
    -DBOARD_CROWPANEL_28=1
    -DAPP_DEBUG_BUILD=1
    -DCORE_DEBUG_LEVEL=5
upload_speed = 115200

; ---------------------------------------------------------------------------
; UI profiling environment — production logging level, but with the
; perf-counters module compiled in (APP_PROFILE_UI=1) so the firmware emits
; a 1 Hz PERF summary line and the LVGL on-screen FPS overlay appears.
; Use this profile to measure touch responsiveness on the real board
; (issue #95).
; ---------------------------------------------------------------------------
[env:debug-perf]
extends      = env:crowpanel_28
build_unflags = -DCORE_DEBUG_LEVEL=1
build_flags =
    ${base_flags.build_flags}
    -DBOARD_CROWPANEL_28=1
    -DCORE_DEBUG_LEVEL=3
    -DAPP_PROFILE_UI=1

    ; Same NimBLE trims as production so the build matches what runs on the
    ; user's device.
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=1
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=4
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=0
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=0
    -DCONFIG_BT_NIMBLE_MESH_ENABLED=0
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=4

    -O2

; ---------------------------------------------------------------------------
; Native unit-test environment — compiles a subset of the firmware sources
; against host-only shims (test/native/shim/) so the parsers and signal store
; can be exercised on the dev machine without an ESP32. Run with:
;   pio test -e native
;
; The shim include path goes BEFORE include/ and src/ so production headers
; like Arduino.h, freertos/FreeRTOS.h, hal/storage/storage_driver.h, and
; diag/logger.h resolve to the host-friendly versions during this build only.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -DUNIT_TEST=1
    -DAPP_SIMULATION_MODE=1
    -DBOARD_CROWPANEL_28=1
    -DCONFIG_SCHEMA_VERSION=\"1.0.0\"
    -I test/native/shim
    -I include
    -I src
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
test_build_src = yes
build_src_filter =
    -<*>
    +<config/config_loader.cpp>
    +<config/json_reader.cpp>
    +<runtime/signal_store.cpp>
    +<can/maxxecu_parser.cpp>
    +<can/signal_map.cpp>
    +<ui/sensor_color_ramp.cpp>
    +<hal/wifi/ota_hmac.cpp>
    +<../test/native/shim/hal/storage/storage_driver_fake.cpp>

; ---------------------------------------------------------------------------
; Secure-boot-v2 + flash-encryption environment — OPT-IN, PRODUCTION ONLY
; ---------------------------------------------------------------------------
; This env builds a signed image suitable for chips that have been (or will
; be) provisioned with secure boot v2 + flash encryption via the one-time
; first-flash procedure documented in docs/secure-boot-setup.md.
;
; Building this env requires `secrets/secure_boot_signing_key.pem` to exist
; (generate it once via scripts/generate_keys.sh). The signing key is
; per-project, off-Git, and the single most security-critical artifact in
; the project — losing it freezes every fielded device on its current image.
;
; DO NOT FLASH THE OUTPUT TO A DEV BOARD with `pio run -e secure -t upload`
; on a chip that already has secure boot enabled — the upload will be
; plaintext, FLASH_CRYPT_CNT will increment, and the chip will eventually
; refuse to boot. Use scripts/secure_boot_first_flash.sh for fused chips.
;
; sdkconfig overrides (applied via sdkconfig.defaults.secure):
;   CONFIG_SECURE_BOOT_V2_ENABLED=y
;   CONFIG_SECURE_SIGNED_APPS_RSA_SCHEME=y
;   CONFIG_SECURE_BOOT_SIGNING_KEY="secrets/secure_boot_signing_key.pem"
;   CONFIG_FLASH_ENCRYPTION_ENABLED=y
;   CONFIG_SECURE_FLASH_ENC_ENABLED=y
;   CONFIG_SECURE_FLASH_ENCRYPTION_MODE_RELEASE=y
;   CONFIG_BOOTLOADER_APP_ANTI_ROLLBACK=y
[env:secure]
extends                 = env:crowpanel_28
board_build.partitions  = ota_4mb_secure.csv
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults.secure
build_flags =
    ${env:crowpanel_28.build_flags}
    -DAPP_SECURE_BOOT_BUILD=1

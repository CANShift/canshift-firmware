name: pio-setup
description: Set up PlatformIO + Rust toolchain (host, optionally esp32) with caches

inputs:
  espup:
    description: Install the esp32 Xtensa Rust toolchain (needed for firmware builds, not host tests)
    required: false
    default: 'false'
  espup-targets:
    description: Comma-separated chips espup installs the Xtensa toolchain for
    required: false
    default: esp32,esp32s3
  cache-suffix:
    description: Extra key segment to isolate the PlatformIO package cache per matrix leg (e.g. the board)
    required: false
    default: default

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'

    - if: github.ref == 'refs/heads/main'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.platformio/.cache
          ~/.platformio/.packages
          .pio/libdeps
        key: pio-${{ runner.os }}-${{ inputs.cache-suffix }}-${{ hashFiles('platformio.ini') }}
        restore-keys: |
          pio-${{ runner.os }}-${{ inputs.cache-suffix }}-
          pio-${{ runner.os }}-

    - if: github.ref != 'refs/heads/main'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.platformio/.cache
          ~/.platformio/.packages
          .pio/libdeps
        key: pio-${{ runner.os }}-${{ inputs.cache-suffix }}-${{ hashFiles('platformio.ini') }}
        restore-keys: |
          pio-${{ runner.os }}-${{ inputs.cache-suffix }}-
          pio-${{ runner.os }}-

    - shell: bash
      env:
        ESPUP_TARGETS: ${{ inputs.espup-targets }}
      run: |
        {
          echo "ESPUP_TARGETS_KEY=${ESPUP_TARGETS//,/-}"
          echo "ESPUP_VERSION=0.17.1"
          echo "XTENSA_TOOLCHAIN_VERSION=1.97.0.0"
          echo "PLATFORMIO_VERSION=6.2.0"
          echo "CARGO_NET_RETRY=10"
          echo "CARGO_HTTP_TIMEOUT=60"
          echo "PIP_RETRIES=10"
          echo "PIP_TIMEOUT=60"
        } >> "$GITHUB_ENV"

    - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      with:
        toolchain: stable

    - if: github.ref == 'refs/heads/main'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.rustup
          !~/.rustup/toolchains/esp
          rust/target
        key: rust-${{ runner.os }}-${{ hashFiles('rust/**/Cargo.toml', 'rust/**/Cargo.lock') }}
        restore-keys: rust-${{ runner.os }}-

    - if: github.ref != 'refs/heads/main'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.rustup
          !~/.rustup/toolchains/esp
          rust/target
        key: rust-${{ runner.os }}-${{ hashFiles('rust/**/Cargo.toml', 'rust/**/Cargo.lock') }}
        restore-keys: rust-${{ runner.os }}-

    - if: inputs.espup == 'true' && github.ref == 'refs/heads/main'
      id: espup-cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/bin/espup
          ~/.rustup/toolchains/esp
          ~/export-esp.sh
        key: espup-${{ runner.os }}-${{ env.ESPUP_VERSION }}-${{ env.XTENSA_TOOLCHAIN_VERSION }}-${{ env.ESPUP_TARGETS_KEY }}

    - if: inputs.espup == 'true' && github.ref != 'refs/heads/main'
      id: espup-cache-restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/bin/espup
          ~/.rustup/toolchains/esp
          ~/export-esp.sh
        key: espup-${{ runner.os }}-${{ env.ESPUP_VERSION }}-${{ env.XTENSA_TOOLCHAIN_VERSION }}-${{ env.ESPUP_TARGETS_KEY }}

    - if: inputs.espup == 'true' && steps.espup-cache.outputs.cache-hit != 'true' && steps.espup-cache-restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        ESPUP_TARGETS: ${{ inputs.espup-targets }}
        RETRY_ATTEMPTS: 4
        RETRY_BACKOFF_SECONDS: 20
      run: |
        retry() {
          for attempt in $(seq "$RETRY_ATTEMPTS"); do
            "$@" && return 0
            echo "::warning::attempt ${attempt}/${RETRY_ATTEMPTS} failed: $*"
            sleep $((attempt * RETRY_BACKOFF_SECONDS))
          done
          return 1
        }
        retry cargo install espup --locked --force --version "${ESPUP_VERSION}"
        retry espup install --targets "${ESPUP_TARGETS}" --toolchain-version "${XTENSA_TOOLCHAIN_VERSION}"

    - if: inputs.espup == 'true'
      shell: bash
      run: |
        . ~/export-esp.sh
        echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"
        for dir in $(echo "$PATH" | tr ':' '\n' | grep -E '(esp|rustup)' || true); do
          echo "$dir" >> "$GITHUB_PATH"
        done

    - shell: bash
      run: pip install "platformio==${PLATFORMIO_VERSION}"

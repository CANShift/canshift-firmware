name: Release

on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
  ARTIFACT_RETENTION_DAYS: 1

jobs:
  check-version:
    name: Check version
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - name: Read firmware version
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::package.json version is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Release ${TAG} already exists, published or draft — skipping."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "New version ${TAG} — will release."
          fi
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  audit:
    name: No RustSec advisory at release time
    needs: [check-version]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-audit
      - name: cargo audit
        working-directory: rust
        run: cargo audit --deny warnings

  set-matrix:
    name: Resolve chip matrix
    needs: [check-version, audit]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      chips: ${{ steps.read.outputs.chips }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - id: read
        run: |
          echo "chips=$(jq -c '[.[] | select(.universal) | {chip, pio_env: .id}]' .github/boards.json)" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create draft release
    needs: [check-version, audit]
    if: needs.check-version.outputs.should_release == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ needs.check-version.outputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - name: Create GitHub Release if missing
        run: |
          if ! gh release view "${TAG}" > /dev/null 2>&1; then
            gh release create "${TAG}" \
              --title "${TAG}" \
              --target "${HEAD_SHA}" \
              --notes "Firmware-only release. See README.md for the bundled changes." \
              --draft
          fi

      - name: Flag 0.x releases as pre-release
        if: startsWith(needs.check-version.outputs.tag, 'v0.')
        run: gh release edit "${TAG}" --prerelease

  firmware-build:
    name: Firmware — build
    needs: [check-version, set-matrix]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAG: ${{ needs.check-version.outputs.tag }}
      VERSION: ${{ needs.check-version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.set-matrix.outputs.chips) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - uses: ./.github/actions/pio-setup
        with:
          espup: 'true'
          espup-targets: ${{ matrix.chip }}
          cache-suffix: release-${{ matrix.chip }}

      - name: Build universal firmware for ${{ matrix.chip }} (env ${{ matrix.pio_env }})
        run: platformio run -e "${{ matrix.pio_env }}"

      - name: Assert APP_VERSION_STR was injected into firmware binary
        run: |
          ELF=.pio/build/${{ matrix.pio_env }}/firmware.elf
          # The boot banner LOG_INFO is compiled out in prod (APP_LOG_LEVEL=1)
          # so we can't rely on its string. The splash label literal
          # `"v" APP_VERSION_STR` in boot_sequence.cpp survives because it's a
          # plain string passed to lv_label_set_text. Use the explicit `0.0.0-unset`
          # fallback as the negative signal — if it appears, the macro wasn't
          # injected.
          if strings "$ELF" | grep -qF "0.0.0-unset"; then
            echo "::error::APP_VERSION_STR fell back to 0.0.0-unset in $ELF"
            echo "extra_targets.py likely failed to inject the macro into projenv."
            strings "$ELF" | grep -E "v[0-9]+\.[0-9]+\.[0-9]+|0\.0\.0-unset" | head -10
            exit 1
          fi
          if ! strings "$ELF" | grep -qF "v${VERSION}"; then
            echo "::error::APP_VERSION_STR mismatch — no 'v${VERSION}' literal in $ELF"
            strings "$ELF" | grep -E "v[0-9]+\.[0-9]+\.[0-9]+|0\.0\.0-unset" | head -10
            exit 1
          fi
          echo "APP_VERSION_STR=v${VERSION} confirmed in firmware ELF."

      - name: Build SPIFFS image
        run: platformio run --target buildfs -e "${{ matrix.pio_env }}"

      - name: Stage release assets (firmware partition, merged image, SPIFFS)
        run: |
          CHIP=${{ matrix.chip }}
          PIO_ENV=${{ matrix.pio_env }}
          pip install --require-hashes -r .github/requirements/esptool.txt
          case "$CHIP" in
            esp32)                   BOOTLOADER_ADDR=0x1000 ;;
            esp32s2|esp32s3|esp32c3) BOOTLOADER_ADDR=0x0 ;;
            *) echo "::error title=unknown chip::no bootloader offset known for '$CHIP'"; exit 1 ;;
          esac
          echo "Merging ${CHIP} (built from ${PIO_ENV}) with bootloader at ${BOOTLOADER_ADDR}"
          mkdir -p dist
          python -m esptool --chip "$CHIP" merge_bin \
            -o "dist/canshift-${CHIP}-${TAG}-merged.bin" \
            "$BOOTLOADER_ADDR" ".pio/build/${PIO_ENV}/bootloader.bin" \
            0x8000 ".pio/build/${PIO_ENV}/partitions.bin" \
            0x10000 ".pio/build/${PIO_ENV}/firmware.bin"
          cp ".pio/build/${PIO_ENV}/firmware.bin" "dist/canshift-${CHIP}-${TAG}-firmware.bin"
          cp ".pio/build/${PIO_ENV}/spiffs.bin" "dist/canshift-${CHIP}-${TAG}-spiffs.bin"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-${{ matrix.chip }}
          path: dist/
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  secure-build:
    name: Secure boot images — build (esp32s3)
    needs: [check-version, audit]
    if: needs.check-version.outputs.should_release == 'true' && vars.SECURE_BOOT_RELEASE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PIO_ENV: waveshare_s3_28_secure
      UNSIGNED_DIR: ${{ github.workspace }}/secure-unsigned
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - uses: ./.github/actions/pio-setup
        with:
          espup: 'true'
          espup-targets: esp32s3
          cache-suffix: release-secure-esp32s3

      - name: Build the secure app
        run: platformio run -e "$PIO_ENV"

      - name: Build the secure bootloader (ESP-IDF v4.4.6)
        run: scripts/secure_boot_bootloader.sh esp32s3 "$UNSIGNED_DIR"

      - name: Stage the unsigned images
        run: cp ".pio/build/${PIO_ENV}/firmware.bin" ".pio/build/${PIO_ENV}/partitions.bin" "$UNSIGNED_DIR/"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secure-unsigned
          path: |
            secure-unsigned/bootloader.bin
            secure-unsigned/firmware.bin
            secure-unsigned/partitions.bin
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  secure-sign:
    name: Secure boot images — sign (esp32s3)
    needs: [check-version, secure-build]
    environment: secure-boot-signing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ needs.check-version.outputs.tag }}
      EXPECTED_KEY_DIGEST: ${{ vars.SECURE_BOOT_KEY_DIGEST }}
      UNSIGNED_DIR: ${{ github.workspace }}/secure-unsigned
      SIGNED_DIR: ${{ github.workspace }}/secure-signed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
          sparse-checkout: |
            .github/requirements
            scripts

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install esptool
        run: pip install --require-hashes -r .github/requirements/esptool.txt

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: secure-unsigned
          path: secure-unsigned

      - name: Sign with the secure boot key
        env:
          SECURE_BOOT_SIGNING_KEY: ${{ secrets.SECURE_BOOT_SIGNING_KEY }}
        run: |
          if [ -z "${SECURE_BOOT_SIGNING_KEY:-}" ] || [ -z "${EXPECTED_KEY_DIGEST:-}" ]; then
            echo "::error title=secure boot::SECURE_BOOT_SIGNING_KEY and SECURE_BOOT_KEY_DIGEST must both be set on the secure-boot-signing environment"
            exit 1
          fi
          install -d -m 700 "$RUNNER_TEMP/key"
          printf '%s' "$SECURE_BOOT_SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/key/secure-boot.pem"
          scripts/secure_boot_sign.sh "$RUNNER_TEMP/key/secure-boot.pem" \
            "$UNSIGNED_DIR/bootloader.bin" \
            "$UNSIGNED_DIR/firmware.bin" \
            "$SIGNED_DIR"

      - name: Destroy the decoded key
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/key"

      - name: Signing key matches the digest the chips are fused with
        run: |
          ACTUAL=$(od -An -tx1 -v "$SIGNED_DIR/secure-boot-key-digest.bin" | tr -d ' \n')
          if [ "$ACTUAL" != "$EXPECTED_KEY_DIGEST" ]; then
            echo "::error title=secure boot::signing key digest ${ACTUAL} is not SECURE_BOOT_KEY_DIGEST"
            exit 1
          fi

      - name: Stage secure release assets
        run: |
          PREFIX="dist/canshift-esp32s3-secure-${TAG}"
          mkdir -p dist
          cp "$SIGNED_DIR/bootloader.bin" "${PREFIX}-bootloader.bin"
          cp "$UNSIGNED_DIR/partitions.bin" "${PREFIX}-partitions.bin"
          cp "$SIGNED_DIR/firmware.bin" "${PREFIX}-firmware.bin"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: secure-signed
          path: dist/
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  ota-sign:
    name: Sign release assets with Ed25519
    needs: [check-version, firmware-build, secure-sign]
    if: >-
      always()
      && needs.check-version.outputs.should_release == 'true'
      && needs.firmware-build.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.secure-sign.result)
    environment: firmware-signing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
          sparse-checkout: |
            .github/requirements
            keys
            scripts

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install cryptography
        run: pip install --require-hashes -r .github/requirements/cryptography.txt

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Sign and verify every release image
        env:
          FIRMWARE_SIGNING_PRIVATE_KEY: ${{ secrets.FIRMWARE_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${FIRMWARE_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::FIRMWARE_SIGNING_PRIVATE_KEY is not set — the dash refuses unsigned OTA images"
            exit 1
          fi
          python3 scripts/sign_release_artifacts.py dist/*.bin
          python3 scripts/verify_release_signatures.py keys/firmware-signing-public.pem dist/*.bin

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  attach:
    name: Attach release assets
    needs: [check-version, create-release, ota-sign]
    if: always() && needs.create-release.result == 'success' && needs.ota-sign.result == 'success'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Upload images and signatures to the GitHub Release
        run: |
          for i in 1 2 3 4 5; do
            gh release upload "$TAG" dist/* --clobber && break
            if [ $i -eq 5 ]; then exit 1; fi
            echo "Attempt ${i}: release not ready, retrying in 30s..."
            sleep 30
          done
        env:
          TAG: ${{ needs.check-version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  manifest:
    name: Publish firmware + board manifest
    needs: [check-version, attach]
    if: needs.check-version.outputs.should_release == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ needs.check-version.outputs.tag }}
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - name: Download release binaries
        run: |
          mkdir -p dist
          for i in 1 2 3 4 5; do
            gh release download "${TAG}" --dir dist --pattern 'canshift-*.bin' --clobber && break
            if [ $i -eq 5 ]; then exit 1; fi
            echo "Attempt ${i}: assets not ready, retrying in 30s..."
            sleep 30
          done
          ls -l dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Build manifest.json
        run: |
          python3 scripts/build_manifest.py "$TAG" "$VERSION" dist > manifest.json
          cat manifest.json

      - name: Attach manifest.json to GitHub Release
        run: |
          for i in 1 2 3 4 5; do
            gh release upload "${TAG}" manifest.json --clobber && break
            if [ $i -eq 5 ]; then exit 1; fi
            echo "Attempt ${i}: release not ready, retrying in 30s..."
            sleep 30
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

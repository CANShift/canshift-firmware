[workspace]
resolver = "2"
members = [
    "signal-map",
    "can-parser",
    "usb-envelope",
    "config-loader",
    "format-float",
    "error-store",
    "alert-engine",
    "timer-core",
    "layout-grid",
    "control-state",
    "unit-convert",
]

# Workspace-shared profile knobs — Phase 1 host build only. ESP32 target
# integration (espup, xtensa-esp32-none-elf) lands in Phase 2 with the
# PlatformIO pre-build script.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

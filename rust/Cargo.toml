[workspace]
resolver = "2"
members = [
    "signal-map",
    "can-parser",
    "usb-envelope",
    "config-loader",
    "format-float",
    "error-store",
    "alert-engine",
    "timer-core",
    "layout-grid",
    "control-state",
    "unit-convert",
    "workshop-mode",
    "ota-signature",
    "canshift-ffi",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

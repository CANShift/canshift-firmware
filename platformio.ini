; dash-firmware — PlatformIO project configuration
; Target: Elecrow CrowPanel 2.8" ESP32 (ILI9341 320x240 + XPT2046 touch)
; Framework: Arduino
; See include/board_config.h for hardware pin assignments

[platformio]
default_envs = crowpanel_28
extra_scripts = scripts/extra_targets.py

; ---------------------------------------------------------------------------
; Shared build flags — inherited by all environments
; ---------------------------------------------------------------------------
[base_flags]
build_flags =
    ; Board identification
    -DBOARD_CROWPANEL_28=1

    ; LVGL — explicitly add include/ to the search path so LVGL's __has_include
    ; finds lv_conf.h even when compiling library code.
    ; LV_CONF_INCLUDE_SIMPLE triggers #include "lv_conf.h" inside LVGL.
    -DLV_CONF_INCLUDE_SIMPLE=1
    -I include

    ; TFT_eSPI touch — TOUCH_CS must be defined at compiler level so TFT_eSPI
    ; compiles getTouch() into the library (it guards on #ifdef TOUCH_CS).
    ; User_Setup.h in include/ also sets this but the library may compile before
    ; finding the project's User_Setup.h via -I include.
    -DTOUCH_CS=33

    ; ArduinoJson — use JsonDocument (v7 API)
    -DARDUINO_JSON_VERSION=7

    ; FreeRTOS task stack sizes (bytes)
    -DTASK_STACK_UI=8192
    -DTASK_STACK_CAN=4096
    -DTASK_STACK_USB=4096
    -DTASK_STACK_SIM=2048

    ; Enable C++17
    -std=gnu++17

; ---------------------------------------------------------------------------
; Production environment — CrowPanel 2.8"
; ---------------------------------------------------------------------------
[env:crowpanel_28]
platform    = espressif32@5.4.0
board       = esp32dev
framework   = arduino

; Serial monitor — DTR/RTS held low so opening the monitor auto-resets the
; ESP32 (CH340 auto-reset circuit). Without this, boot logs are missed
; because the monitor opens after the chip has already booted.
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
monitor_dtr     = 0
monitor_rts     = 0

; Partition scheme — dual OTA + SPIFFS (required for mobile OTA)
; app0/app1 = 1.3 MB each, spiffs = 1.2 MB
board_build.partitions = ota_4mb.csv
board_build.filesystem = spiffs

; Upload settings — 460800 is reliable on CH340 + standard USB cables;
; 921600 causes "StopIteration" / SLIP read timeouts on many setups.
upload_speed   = 460800

build_flags =
    ${base_flags.build_flags}
    -DCORE_DEBUG_LEVEL=3

    ; NimBLE memory + flash footprint reduction.
    ; Peripheral-only role: disable central/observer/broadcaster/mesh (unused).
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=1
    -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=4
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=0
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=0
    -DCONFIG_BT_NIMBLE_MESH_ENABLED=0
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=4

; Libraries
lib_deps =
    ; LVGL 8.3 — stable release for ESP32
    lvgl/lvgl @ ^8.3.11

    ; TFT_eSPI — display + touch driver
    bodmer/TFT_eSPI @ ^2.5.43

    ; ArduinoJson v7
    bblanchon/ArduinoJson @ ^7.2.0

    ; NimBLE — compact BLE stack for ESP32 (~200KB vs 500KB for Bluedroid)
    ; Used for mobile app telemetry stream and settings sync
    h2zero/NimBLE-Arduino @ ^1.4.3

lib_ldf_mode = deep+

; ---------------------------------------------------------------------------
; Simulation environment — build with SIM mode ON, no hardware required
; Useful for CI and UI development without the physical board
; ---------------------------------------------------------------------------
[env:sim]
extends      = env:crowpanel_28
build_unflags = -DCORE_DEBUG_LEVEL=3
build_flags =
    ${base_flags.build_flags}
    -DAPP_SIMULATION_MODE=1
    -DAPP_BLE_ENABLED=0
    -DCORE_DEBUG_LEVEL=4

; ---------------------------------------------------------------------------
; Debug environment — verbose logging, slow upload
; ---------------------------------------------------------------------------
[env:debug]
extends      = env:crowpanel_28
build_unflags = -DCORE_DEBUG_LEVEL=3
build_flags =
    ${base_flags.build_flags}
    -DAPP_DEBUG_BUILD=1
    -DCORE_DEBUG_LEVEL=5
upload_speed = 460800

name: pio-setup
description: Set up PlatformIO + Rust toolchain (host, optionally esp32) with caches

inputs:
  espup:
    description: Install the esp32 Xtensa Rust toolchain (needed for firmware builds, not host tests)
    required: false
    default: 'false'
  espup-targets:
    description: Comma-separated chips espup installs the Xtensa toolchain for
    required: false
    default: esp32,esp32s3
  cache-suffix:
    description: Extra key segment to isolate the .pio build cache per matrix leg (e.g. the board)
    required: false
    default: default
  build-cache:
    description: Restore the .pio build tree; release builds pass 'false' so no stale object reaches a shipped image
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - uses: actions/cache@v6
      with:
        path: |
          ~/.platformio/.cache
          ~/.platformio/.packages
          ${{ inputs.build-cache == 'true' && '.pio' || '' }}
        key: pio-${{ runner.os }}-${{ inputs.cache-suffix }}-${{ hashFiles('platformio.ini') }}
        restore-keys: |
          pio-${{ runner.os }}-${{ inputs.cache-suffix }}-
          pio-${{ runner.os }}-

    - uses: dtolnay/rust-toolchain@stable

    - uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/bin/espup
          ~/.cargo/registry
          ~/.cargo/git
          ~/.rustup
          rust/target
        key: rust-${{ runner.os }}-${{ hashFiles('rust/**/Cargo.toml', 'rust/**/Cargo.lock') }}
        restore-keys: rust-${{ runner.os }}-

    - if: inputs.espup == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
        ESPUP_VERSION: 0.17.1
        XTENSA_TOOLCHAIN_VERSION: 1.97.0.0
        ESPUP_TARGETS: ${{ inputs.espup-targets }}
      run: |
        if [ "$(espup --version 2>/dev/null)" != "espup ${ESPUP_VERSION}" ]; then
          cargo install espup --locked --force --version "${ESPUP_VERSION}"
        fi
        espup install --targets "${ESPUP_TARGETS}" --toolchain-version "${XTENSA_TOOLCHAIN_VERSION}"
        . ~/export-esp.sh
        echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"
        for dir in $(echo "$PATH" | tr ':' '\n' | grep -E '(esp|rustup)' || true); do
          echo "$dir" >> "$GITHUB_PATH"
        done

    - shell: bash
      env:
        PLATFORMIO_VERSION: 6.2.0
      run: pip install "platformio==${PLATFORMIO_VERSION}"

name: lint

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: '3.12'
  CLANG_FORMAT_VERSION: '22.1.8'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: clang-format
        run: |
          pip install "clang-format==${CLANG_FORMAT_VERSION}"
          find src include test sim \( -name "*.cpp" -o -name "*.h" -o -name "*.inc" \) \
            ! -name 'lv_conf.h' -print0 \
            | xargs -0 clang-format --dry-run --Werror --style=file
      - name: FFI constant parity
        run: python3 scripts/check_ffi_parity.py
      - name: Board lists agree
        run: python3 scripts/check_board_lists.py
      - name: Release manifest builds
        run: python3 scripts/build_manifest.py v0.0.0-lint 0.0.0-lint > /dev/null

  rust:
    name: rust
    runs-on: ubuntu-latest
    # The workspace pins the Espressif fork for the xtensa target; the host
    # test and lint pass needs neither, so it runs on stable without espup.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7.0.1
      - name: cargo test
        run: cargo test --workspace
        working-directory: rust
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: rust
      - name: cargo fmt
        run: cargo fmt --all --check
        working-directory: rust

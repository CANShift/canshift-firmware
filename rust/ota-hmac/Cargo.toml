[package]
name = "ota-hmac"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust port of CANShift OTA HMAC verifier — issue #827 / #936 spike"
license = "UNLICENSED"

[lib]
# Phase 1: rlib only — host parity tests run via `cargo test`.
# Phase 2 will add `crate-type = ["staticlib"]` so PlatformIO can link the
# resulting `.a` into the ESP32 firmware.
crate-type = ["rlib"]

[dependencies]
# Crypto: RustCrypto's well-audited HMAC + SHA-256 implementations. Both
# crates support `#![no_std]` so the Phase 2 ESP32 build will pull them in
# unchanged.
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
# Hex parser for fixture comparison in tests.
hex = "0.4"

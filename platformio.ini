; dash-firmware — PlatformIO project configuration
; Target: Elecrow CrowPanel 2.8" ESP32 (ILI9341 320x240 + XPT2046 touch)
; Framework: Arduino
; See include/board_config.h for hardware pin assignments

[platformio]
default_envs = crowpanel_28

; ---------------------------------------------------------------------------
; Production environment — CrowPanel 2.8"
; ---------------------------------------------------------------------------
[env:crowpanel_28]
platform    = espressif32
board       = esp32dev
framework   = arduino

; Serial monitor
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time

; Partition scheme — 4MB flash with SPIFFS
; dashboard.json, signals.json, theme.json, assets → SPIFFS partition
board_build.partitions = spiffs_4mb.csv
board_build.filesystem = spiffs

; Upload settings
upload_speed   = 921600

; Build flags
build_flags =
    ; Board identification
    -DBOARD_CROWPANEL_28=1

    ; LVGL — include/ is on the search path; LV_CONF_INCLUDE_SIMPLE triggers #include "lv_conf.h"
    -DLV_CONF_INCLUDE_SIMPLE=1

    ; TFT_eSPI — User_Setup.h lives in include/, found automatically via include path
    ; USER_SETUP_LOADED intentionally NOT set so TFT_eSPI auto-includes User_Setup.h

    ; ArduinoJson — use JsonDocument (v7 API)
    -DARDUINO_JSON_VERSION=7

    ; FreeRTOS task stack sizes (bytes)
    -DTASK_STACK_UI=8192
    -DTASK_STACK_CAN=4096
    -DTASK_STACK_USB=4096
    -DTASK_STACK_SIM=2048

    ; Enable C++17
    -std=gnu++17

    ; Logging — 3=INFO, 4=DEBUG, 5=VERBOSE
    -DCORE_DEBUG_LEVEL=3

; Libraries
lib_deps =
    ; LVGL 8.3 — stable release for ESP32
    lvgl/lvgl @ ^8.3.11

    ; TFT_eSPI — display + touch driver
    bodmer/TFT_eSPI @ ^2.5.43

    ; ArduinoJson v7
    bblanchon/ArduinoJson @ ^7.2.0

    ; LVGL requires this for filesystem (SPIFFS)
    ; ESP32 SPIFFS built into framework — no extra lib needed

lib_ldf_mode = deep+

; ---------------------------------------------------------------------------
; Simulation environment — build with SIM mode ON, no hardware required
; Useful for CI and UI development without the physical board
; ---------------------------------------------------------------------------
[env:sim]
extends     = env:crowpanel_28
build_flags =
    ${env:crowpanel_28.build_flags}
    -DAPP_SIMULATION_MODE=1
    -DCORE_DEBUG_LEVEL=4

; ---------------------------------------------------------------------------
; Debug environment — verbose logging, slow upload
; ---------------------------------------------------------------------------
[env:debug]
extends     = env:crowpanel_28
build_flags =
    ${env:crowpanel_28.build_flags}
    -DAPP_DEBUG_BUILD=1
    -DCORE_DEBUG_LEVEL=5
upload_speed = 460800

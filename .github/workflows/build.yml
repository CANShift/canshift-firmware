name: build

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.12'
  CLANG_FORMAT_VERSION: '22.1.8'
  RUFF_VERSION: '0.17.0'
  ACTIONLINT_VERSION: '1.7.12'
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  SHELLCHECK_VERSION: '0.11.0'
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
  PRETTIER_VERSION: '3.9.6'
  ESPTOOL_VERSION: '5.5.0'
  CRYPTOGRAPHY_VERSION: '50.0.2'

jobs:
  native:
    name: native tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The host static libs are x86; the workspace pins the Espressif fork for
    # the xtensa target only, and this job never installs espup.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pio-setup
      - name: native tests
        run: pio test -e native

  perf:
    name: perf bench
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: stable
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          path: .bench-base
          persist-credentials: false
      - uses: ./.github/actions/pio-setup
        with:
          cache-suffix: bench
      - name: build head
        run: pio run -e bench
      - name: build baseline
        id: base
        run: |
          if ! grep -q '^\[env:bench\]' .bench-base/platformio.ini; then
            echo "::notice title=perf bench::baseline ${BASE_SHA::7} has no bench env; comparing head against itself"
            exit 0
          fi
          (cd .bench-base && pio run -e bench)
          echo "root=.bench-base" >> "$GITHUB_OUTPUT"
      - name: compare
        env:
          BASE_ROOT: ${{ steps.base.outputs.root }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 scripts/bench_perf.py ${BASE_ROOT:+--base-root "$BASE_ROOT"} ${PR_NUMBER:+--pr "$PR_NUMBER"} \
            --baseline-label "${BASE_SHA::7}" --report perf-report.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: perf-report
          path: perf-report.json
          if-no-files-found: ignore
          retention-days: 14

  goldens:
    name: behaviour goldens
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pio-setup
        with:
          cache-suffix: bench
      - name: build bench
        run: pio run -e bench
      - name: compare against bench/goldens
        run: |
          python3 scripts/bench_goldens.py --failures golden-failures \
            --report goldens-report.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: goldens-report
          path: |
            goldens-report.json
            golden-failures/
          if-no-files-found: ignore
          retention-days: 14

  visual:
    name: visual goldens
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev
      - uses: ./.github/actions/pio-setup
        with:
          cache-suffix: sim
      - name: build sim
        run: pio run -e sim
      - name: compare against bench/goldens/visual
        run: |
          python3 scripts/bench_visual.py --failures visual-failures \
            --report visual-report.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: visual-report
          path: |
            visual-report.json
            visual-failures/
          if-no-files-found: ignore
          retention-days: 14

  set-matrix:
    name: resolve board matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      boards: ${{ steps.read.outputs.boards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: read
        run: echo "boards=$(jq -c '[.[].id]' .github/boards.json)" >> "$GITHUB_OUTPUT"

  firmware:
    name: firmware
    needs: set-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.set-matrix.outputs.boards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/pio-setup
        with:
          espup: 'true'
          cache-suffix: ${{ matrix.board }}

      - name: build (${{ matrix.board }})
        run: |
          pio run -e "${{ matrix.board }}" 2>&1 | tee build.log \
            || { echo "::error title=firmware build failed::board '${{ matrix.board }}' failed to build"; exit 1; }

      - name: link invariants
        run: python3 scripts/check_link_invariants.py ".pio/build/${{ matrix.board }}/firmware.map"

      - name: flash budget gate
        run: |
          PCT=$(grep '^Flash:' build.log | grep -oE '[0-9]+\.[0-9]+%' | head -1 | tr -d '%')
          awk -v p="$PCT" 'BEGIN { exit (p > 98) ? 1 : 0 }' \
            || { echo "::error title=flash budget::board '${{ matrix.board }}' flash ${PCT}% > 98% (#305 / #158)"; exit 1; }

      - name: measure sizes
        run: |
          python3 scripts/bench_size.py measure --board "${{ matrix.board }}" \
            --elf ".pio/build/${{ matrix.board }}/firmware.elf" \
            --bin ".pio/build/${{ matrix.board }}/firmware.bin" \
            --out "size-${{ matrix.board }}.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: size-${{ matrix.board }}
          path: size-${{ matrix.board }}.json
          if-no-files-found: error
          retention-days: 14

      - name: buildfs (${{ matrix.board }})
        run: pio run -e "${{ matrix.board }}" -t buildfs

      - name: verify spiffs round-trip
        run: |
          MKSPIFFS=$(find ~/.platformio/packages/tool-mkspiffs -name 'mkspiffs_espressif32_arduino' | head -1)
          if [ -z "$MKSPIFFS" ]; then
            echo "::error::mkspiffs binary not found"
            exit 1
          fi
          IMG=".pio/build/${{ matrix.board }}/spiffs.bin"
          STAGED=".pio/build/${{ matrix.board }}/spiffs_data"
          if [ ! -f "$IMG" ]; then
            echo "::error::spiffs.bin not produced by buildfs for '${{ matrix.board }}'"
            exit 1
          fi
          EXTRACT=$(mktemp -d)
          "$MKSPIFFS" -u "$EXTRACT" "$IMG" > /dev/null
          (cd "$STAGED" && find . -type f | sort) > /tmp/src.list
          (cd "$EXTRACT" && find . -type f | sort) > /tmp/img.list
          if ! diff /tmp/src.list /tmp/img.list > /tmp/list.diff; then
            echo "::error::spiffs file list mismatch for '${{ matrix.board }}' (#1240)"
            cat /tmp/list.diff
            exit 1
          fi
          (cd "$STAGED" && find . -type f | sort | xargs -I{} sha256sum {}) > /tmp/src.sha
          (cd "$EXTRACT" && find . -type f | sort | xargs -I{} sha256sum {}) > /tmp/img.sha
          if ! diff /tmp/src.sha /tmp/img.sha > /tmp/sha.diff; then
            echo "::error::spiffs content mismatch for '${{ matrix.board }}'"
            cat /tmp/sha.diff
            exit 1
          fi

  size-budget:
    name: size budget
    needs: firmware
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: size-*
          path: sizes
      - name: compare against bench/size-budget.json
        run: python3 scripts/bench_size.py check --measured sizes --summary "$GITHUB_STEP_SUMMARY"

  secure:
    name: secure build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/pio-setup
        with:
          espup: 'true'
          cache-suffix: secure

      - name: build (secure)
        run: pio run -e secure

  secure-s3:
    name: secure build (esp32s3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SECURE_DIR: ${{ github.workspace }}/.pio/secure-boot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/pio-setup
        with:
          espup: 'true'
          espup-targets: esp32s3
          cache-suffix: secure-s3

      - name: build app (waveshare_s3_28_secure)
        run: pio run -e waveshare_s3_28_secure

      - name: build secure bootloader (ESP-IDF v4.4.6)
        run: scripts/secure_boot_bootloader.sh esp32s3 "$SECURE_DIR/unsigned"

      - name: install esptool
        run: pip install "esptool==${ESPTOOL_VERSION}" "cryptography==${CRYPTOGRAPHY_VERSION}"

      - name: generate a throwaway signing key
        run: |
          install -d -m 700 "$RUNNER_TEMP/keys"
          openssl genrsa -out "$RUNNER_TEMP/keys/secure-boot.pem" 3072
          openssl genrsa -out "$RUNNER_TEMP/keys/other.pem" 3072
          openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/keys/ota.pem"
          openssl pkey -in "$RUNNER_TEMP/keys/ota.pem" -pubout -out "$RUNNER_TEMP/keys/ota-public.pem"

      - name: sign and verify bootloader and app
        run: |
          scripts/secure_boot_sign.sh "$RUNNER_TEMP/keys/secure-boot.pem" \
            "$SECURE_DIR/unsigned/bootloader.bin" \
            .pio/build/waveshare_s3_28_secure/firmware.bin \
            "$SECURE_DIR/signed"

      - name: images refuse a key that did not sign them
        run: |
          for image in bootloader firmware; do
            if python3 -m espsecure verify-signature --version 2 \
              --keyfile "$RUNNER_TEMP/keys/other.pem" "$SECURE_DIR/signed/${image}.bin"; then
              echo "::error title=secure boot::${image}.bin verified against a key that never signed it"
              exit 1
            fi
          done

      - name: OTA signature wraps the secure boot image
        run: |
          FIRMWARE_SIGNING_PRIVATE_KEY=$(base64 -w0 "$RUNNER_TEMP/keys/ota.pem") \
            python3 scripts/sign_release_artifacts.py "$SECURE_DIR/signed/firmware.bin"
          python3 scripts/verify_release_signatures.py "$RUNNER_TEMP/keys/ota-public.pem" \
            "$SECURE_DIR/signed/firmware.bin"
          python3 -m espsecure verify-signature --version 2 \
            --keyfile "$SECURE_DIR/signed/secure-boot-public.pem" "$SECURE_DIR/signed/firmware.bin"

      - name: destroy the throwaway keys and the images they signed
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/keys" "$SECURE_DIR"

  diagnostic:
    name: diagnostic builds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pio-setup
        with:
          espup: 'true'
          cache-suffix: diagnostic
      - name: build with every diagnostic flag on
        run: |
          pio run -e debug-perf \
            || { echo "::error title=diagnostic build failed::code behind APP_PROFILE_UI / APP_USB_TICK_TRACE / APP_LV_TASK_LOG no longer compiles (#109)"; exit 1; }
      - name: build with BLE disabled
        run: |
          PLATFORMIO_BUILD_FLAGS="-DAPP_BLE_ENABLED=0" pio run -e debug \
            || { echo "::error title=BLE-disabled build failed::code guarded by APP_BLE_ENABLED no longer compiles without it"; exit 1; }

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: clang-format
        run: |
          pip install "clang-format==${CLANG_FORMAT_VERSION}"
          find src include test sim bench \( -name "*.cpp" -o -name "*.h" -o -name "*.inc" \) \
            ! -name 'lv_conf.h' ! -path 'test/native/vendor/*' -print0 \
            | xargs -0 clang-format --dry-run --Werror --style=file
      - name: FFI constant parity
        run: python3 scripts/check_ffi_parity.py
      - name: Constant naming
        run: python3 scripts/check_constant_naming.py
      - name: Release envs keep OTA signature checks
        run: python3 scripts/check_release_flags.py
      - name: Board lists agree
        run: python3 scripts/check_board_lists.py
      - name: Release manifest builds
        run: python3 scripts/build_manifest.py v0.0.0-lint 0.0.0-lint > /dev/null

  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The workspace pins the Espressif fork for the xtensa target; the host
    # test and lint pass needs neither, so it runs on stable without espup.
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_NET_RETRY: 10
      CARGO_HTTP_TIMEOUT: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-host-${{ runner.os }}-${{ hashFiles('rust/**/Cargo.toml', 'rust/**/Cargo.lock') }}
          restore-keys: rust-host-${{ runner.os }}-
      - if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: rust-host-${{ runner.os }}-${{ hashFiles('rust/**/Cargo.toml', 'rust/**/Cargo.lock') }}
          restore-keys: rust-host-${{ runner.os }}-
      - name: cargo test
        run: cargo test --workspace --all-features
        working-directory: rust
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        working-directory: rust
      - name: cargo fmt
        run: cargo fmt --all --check
        working-directory: rust

  scripts:
    name: scripts and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: install actionlint and shellcheck
        run: |
          BIN="$RUNNER_TEMP/bin"
          mkdir -p "$BIN"
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum --check --strict
          tar -xzf actionlint.tar.gz -C "$BIN" actionlint
          curl -fsSL --retry 3 -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.xz" | sha256sum --check --strict
          tar -xJf shellcheck.tar.xz -C "$BIN" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$BIN" >> "$GITHUB_PATH"
      - name: actionlint
        run: |
          shellcheck --version | grep -qx "version: ${SHELLCHECK_VERSION}"
          actionlint
      - name: shellcheck
        run: |
          shellcheck -S warning scripts/*.sh scripts/hooks/*.sh
          shellcheck -S warning -s sh .husky/pre-commit
      - name: ruff
        run: |
          pip install "ruff==${RUFF_VERSION}"
          ruff check .
          ruff format --check .
      - name: prettier (yaml, markdown, json)
        run: npx --yes "prettier@${PRETTIER_VERSION}" --check "**/*.{yml,yaml,md,json}"

  bench-stats:
    name: bench stats
    needs: [firmware, perf, goldens, visual]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: bench-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: reports
      - name: check out bench-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git fetch --depth=1 origin bench-data:bench-data; then
            EMPTY_TREE=$(git hash-object -t tree /dev/null)
            git branch bench-data "$(git commit-tree "$EMPTY_TREE" -m "chore: start the bench history")"
          fi
          git worktree add .bench-data bench-data
      - name: record ${{ github.sha }}
        run: |
          python3 scripts/bench_stats.py record --history .bench-data/history.json \
            --sha "$GITHUB_SHA" --date "$(git show -s --format=%cs "$GITHUB_SHA")" \
            --sizes reports --perf reports/perf-report/perf-report.json \
            --goldens reports/goldens-report/goldens-report.json \
            --visual reports/visual-report/visual-report.json
          python3 scripts/bench_stats.py readme --history .bench-data/history.json --out .bench-data/README.md
      - name: push bench-data
        working-directory: .bench-data
        run: |
          git add history.json README.md
          git commit -m "chore: record bench stats for ${GITHUB_SHA::7}"
          git push origin bench-data

  bench-comment:
    name: bench comment
    needs: [firmware, perf, goldens, visual]
    if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: reports
      - name: fetch the main history
        run: |
          mkdir -p .bench-data
          if git fetch --depth=1 origin bench-data; then
            git show FETCH_HEAD:history.json > .bench-data/history.json
          fi
      - name: render
        run: |
          python3 scripts/bench_stats.py comment --history .bench-data/history.json \
            --sizes reports --perf reports/perf-report/perf-report.json \
            --goldens reports/goldens-report/goldens-report.json \
            --visual reports/visual-report/visual-report.json --out bench-comment.md
      - name: post or update the sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          EXISTING=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- canshift-bench -->"))) | .id' | head -1)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${EXISTING}" -F body=@bench-comment.md > /dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F body=@bench-comment.md > /dev/null
          fi

  core-parity:
    name: core parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: canshift-firmware
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CANShift/canshift-core
          path: canshift-core
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Display tiers agree with core
        working-directory: canshift-firmware
        run: python3 scripts/check_display_tiers.py

  ci-success:
    name: ci-success
    needs:
      [
        native,
        perf,
        goldens,
        visual,
        set-matrix,
        firmware,
        size-budget,
        secure,
        secure-s3,
        diagnostic,
        lint,
        rust,
        scripts,
        core-parity,
      ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: gate
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"'
          if ! echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null; then
            echo "::error::one or more required CI jobs did not succeed — see the job list above"
            exit 1
          fi

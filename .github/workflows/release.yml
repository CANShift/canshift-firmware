name: Release

on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
  ESPTOOL_VERSION: 5.5.0
  CRYPTOGRAPHY_VERSION: 50.0.2

jobs:
  check-version:
    name: Check version
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - name: Read firmware version
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if release already exists
        id: check
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Release ${{ steps.ver.outputs.tag }} already exists — skipping."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "New version ${{ steps.ver.outputs.tag }} — will release."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  set-matrix:
    name: Resolve chip matrix
    needs: [check-version]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      chips: ${{ steps.read.outputs.chips }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - id: read
        run: |
          echo "chips=$(jq -c '[.[] | select(.universal) | {chip, pio_env: .id}]' .github/boards.json)" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create draft release
    needs: [check-version]
    if: needs.check-version.outputs.should_release == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - name: Create GitHub Release if missing
        run: |
          TAG=${{ needs.check-version.outputs.tag }}
          if ! gh release view "${TAG}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release create "${TAG}" \
              --repo "${{ github.repository }}" \
              --title "${TAG}" \
              --target "${HEAD_SHA}" \
              --notes "Firmware-only release. See README.md for the bundled changes." \
              --draft
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Flag 0.x releases as pre-release
        if: startsWith(needs.check-version.outputs.tag, 'v0.')
        run: gh release edit "${{ needs.check-version.outputs.tag }}" --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  firmware-release:
    name: Firmware — build & attach
    needs: [check-version, set-matrix, create-release]
    if: needs.check-version.outputs.should_release == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.set-matrix.outputs.chips) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - uses: ./.github/actions/pio-setup
        with:
          espup: 'true'
          espup-targets: ${{ matrix.chip }}
          cache-suffix: release-${{ matrix.chip }}

      - name: Build universal firmware for ${{ matrix.chip }} (env ${{ matrix.pio_env }})
        run: platformio run -e "${{ matrix.pio_env }}"

      - name: Assert APP_VERSION_STR was injected into firmware binary
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          ELF=.pio/build/${{ matrix.pio_env }}/firmware.elf
          # The boot banner LOG_INFO is compiled out in prod (APP_LOG_LEVEL=1)
          # so we can't rely on its string. The splash label literal
          # `"v" APP_VERSION_STR` in boot_sequence.cpp survives because it's a
          # plain string passed to lv_label_set_text. Use the explicit `0.0.0-unset`
          # fallback as the negative signal — if it appears, the macro wasn't
          # injected.
          if strings "$ELF" | grep -qF "0.0.0-unset"; then
            echo "::error::APP_VERSION_STR fell back to 0.0.0-unset in $ELF"
            echo "extra_targets.py likely failed to inject the macro into projenv."
            strings "$ELF" | grep -E "v[0-9]+\.[0-9]+\.[0-9]+|0\.0\.0-unset" | head -10
            exit 1
          fi
          if ! strings "$ELF" | grep -qF "v${VERSION}"; then
            echo "::error::APP_VERSION_STR mismatch — no 'v${VERSION}' literal in $ELF"
            strings "$ELF" | grep -E "v[0-9]+\.[0-9]+\.[0-9]+|0\.0\.0-unset" | head -10
            exit 1
          fi
          echo "APP_VERSION_STR=v${VERSION} confirmed in firmware ELF."

      - name: Build SPIFFS image
        run: platformio run --target buildfs -e "${{ matrix.pio_env }}"

      - name: Stage release assets (firmware partition, merged image, SPIFFS)
        run: |
          TAG=${{ needs.check-version.outputs.tag }}
          CHIP=${{ matrix.chip }}
          PIO_ENV=${{ matrix.pio_env }}
          pip install "esptool==${ESPTOOL_VERSION}"
          case "$CHIP" in
            esp32)                   BOOTLOADER_ADDR=0x1000 ;;
            esp32s2|esp32s3|esp32c3) BOOTLOADER_ADDR=0x0 ;;
            *) echo "::error title=unknown chip::no bootloader offset known for '$CHIP'"; exit 1 ;;
          esac
          echo "Merging ${CHIP} (built from ${PIO_ENV}) with bootloader at ${BOOTLOADER_ADDR}"
          # Merged factory image — USB esptool flashing only (bootloader + partitions + firmware).
          python -m esptool --chip "$CHIP" merge_bin \
            -o "canshift-${CHIP}-${TAG}-merged.bin" \
            "$BOOTLOADER_ADDR" ".pio/build/${PIO_ENV}/bootloader.bin" \
            0x8000 ".pio/build/${PIO_ENV}/partitions.bin" \
            0x10000 ".pio/build/${PIO_ENV}/firmware.bin"
          # Firmware-partition image — what mobile / tuner OTA must consume.
          cp ".pio/build/${PIO_ENV}/firmware.bin" "canshift-${CHIP}-${TAG}-firmware.bin"
          # SPIFFS image — flashed to the data partition.
          cp ".pio/build/${PIO_ENV}/spiffs.bin" "canshift-${CHIP}-${TAG}-spiffs.bin"

      - name: Sign firmware artifacts with Ed25519
        run: |
          if [ -z "${FIRMWARE_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::FIRMWARE_SIGNING_PRIVATE_KEY is not set — the dash refuses unsigned OTA images"
            exit 1
          fi
          TAG=${{ needs.check-version.outputs.tag }}
          CHIP=${{ matrix.chip }}
          pip install --quiet "cryptography==${CRYPTOGRAPHY_VERSION}"
          python3 scripts/sign_release_artifacts.py \
            "canshift-${CHIP}-${TAG}-merged.bin" \
            "canshift-${CHIP}-${TAG}-firmware.bin" \
            "canshift-${CHIP}-${TAG}-spiffs.bin"
          python3 scripts/verify_release_signatures.py keys/firmware-signing-public.pem \
            "canshift-${CHIP}-${TAG}-merged.bin" \
            "canshift-${CHIP}-${TAG}-firmware.bin" \
            "canshift-${CHIP}-${TAG}-spiffs.bin"
        env:
          FIRMWARE_SIGNING_PRIVATE_KEY: ${{ secrets.FIRMWARE_SIGNING_PRIVATE_KEY }}

      - name: Attach firmware, OTA partition image and SPIFFS to GitHub Release
        run: |
          TAG=${{ needs.check-version.outputs.tag }}
          CHIP=${{ matrix.chip }}
          MERGED="canshift-${CHIP}-${TAG}-merged.bin"
          OTA="canshift-${CHIP}-${TAG}-firmware.bin"
          FS="canshift-${CHIP}-${TAG}-spiffs.bin"
          SIGS=("${MERGED}.sig" "${OTA}.sig" "${FS}.sig")
          for i in 1 2 3 4 5; do
            gh release upload "${TAG}" "${MERGED}" "${OTA}" "${FS}" "${SIGS[@]}" --clobber && break
            if [ $i -eq 5 ]; then exit 1; fi
            echo "Attempt ${i}: release not ready, retrying in 30s..."
            sleep 30
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  secure-release:
    name: Secure boot images (esp32s3)
    needs: [check-version, create-release]
    if: needs.check-version.outputs.should_release == 'true' && vars.SECURE_BOOT_RELEASE == 'true'
    environment: secure-boot-signing
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PIO_ENV: waveshare_s3_28_secure
      EXPECTED_KEY_DIGEST: ${{ vars.SECURE_BOOT_KEY_DIGEST }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - uses: ./.github/actions/pio-setup
        with:
          espup: 'true'
          espup-targets: esp32s3
          cache-suffix: release-secure-esp32s3

      - name: Build the secure app
        run: platformio run -e "$PIO_ENV"

      - name: Build the secure bootloader (ESP-IDF v4.4.6)
        run: scripts/secure_boot_bootloader.sh esp32s3 "$RUNNER_TEMP/secure/unsigned"

      - name: Install esptool
        run: pip install "esptool==${ESPTOOL_VERSION}" "cryptography==${CRYPTOGRAPHY_VERSION}"

      - name: Sign with the secure boot key
        env:
          SECURE_BOOT_SIGNING_KEY: ${{ secrets.SECURE_BOOT_SIGNING_KEY }}
        run: |
          if [ -z "${SECURE_BOOT_SIGNING_KEY:-}" ] || [ -z "${EXPECTED_KEY_DIGEST:-}" ]; then
            echo "::error title=secure boot::SECURE_BOOT_SIGNING_KEY and SECURE_BOOT_KEY_DIGEST must both be set on the secure-boot-signing environment"
            exit 1
          fi
          install -d -m 700 "$RUNNER_TEMP/key"
          printf '%s' "$SECURE_BOOT_SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/key/secure-boot.pem"
          scripts/secure_boot_sign.sh "$RUNNER_TEMP/key/secure-boot.pem" \
            "$RUNNER_TEMP/secure/unsigned/bootloader.bin" \
            ".pio/build/${PIO_ENV}/firmware.bin" \
            "$RUNNER_TEMP/secure/signed"

      - name: Destroy the decoded key
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/key"

      - name: Signing key matches the digest the chips are fused with
        run: |
          ACTUAL=$(od -An -tx1 -v "$RUNNER_TEMP/secure/signed/secure-boot-key-digest.bin" | tr -d ' \n')
          if [ "$ACTUAL" != "$EXPECTED_KEY_DIGEST" ]; then
            echo "::error title=secure boot::signing key digest ${ACTUAL} is not SECURE_BOOT_KEY_DIGEST"
            exit 1
          fi

      - name: Stage secure release assets
        run: |
          PREFIX="canshift-esp32s3-secure-${{ needs.check-version.outputs.tag }}"
          cp "$RUNNER_TEMP/secure/signed/bootloader.bin" "${PREFIX}-bootloader.bin"
          cp ".pio/build/${PIO_ENV}/partitions.bin" "${PREFIX}-partitions.bin"
          cp "$RUNNER_TEMP/secure/signed/firmware.bin" "${PREFIX}-firmware.bin"
          echo "PREFIX=${PREFIX}" >> "$GITHUB_ENV"

      - name: Sign the secure-boot-signed images with Ed25519
        run: |
          python3 scripts/sign_release_artifacts.py \
            "${PREFIX}-bootloader.bin" "${PREFIX}-partitions.bin" "${PREFIX}-firmware.bin"
          python3 scripts/verify_release_signatures.py keys/firmware-signing-public.pem \
            "${PREFIX}-bootloader.bin" "${PREFIX}-partitions.bin" "${PREFIX}-firmware.bin"
        env:
          FIRMWARE_SIGNING_PRIVATE_KEY: ${{ secrets.FIRMWARE_SIGNING_PRIVATE_KEY }}

      - name: Attach secure images to GitHub Release
        run: |
          FILES=()
          for kind in bootloader partitions firmware; do
            FILES+=("${PREFIX}-${kind}.bin" "${PREFIX}-${kind}.bin.sig")
          done
          for i in 1 2 3 4 5; do
            gh release upload "${{ needs.check-version.outputs.tag }}" "${FILES[@]}" --clobber && break
            if [ $i -eq 5 ]; then exit 1; fi
            echo "Attempt ${i}: release not ready, retrying in 30s..."
            sleep 30
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  manifest:
    name: Publish firmware + board manifest
    needs: [check-version, firmware-release]
    if: needs.check-version.outputs.should_release == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - name: Download release binaries
        run: |
          TAG=${{ needs.check-version.outputs.tag }}
          mkdir -p dist
          for i in 1 2 3 4 5; do
            gh release download "${TAG}" --dir dist --pattern 'canshift-*.bin' --clobber && break
            if [ $i -eq 5 ]; then exit 1; fi
            echo "Attempt ${i}: assets not ready, retrying in 30s..."
            sleep 30
          done
          ls -l dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Build manifest.json
        run: |
          TAG=${{ needs.check-version.outputs.tag }}
          VERSION=${{ needs.check-version.outputs.version }}
          python3 scripts/build_manifest.py "$TAG" "$VERSION" dist > manifest.json
          cat manifest.json

      - name: Attach manifest.json to GitHub Release
        run: |
          TAG=${{ needs.check-version.outputs.tag }}
          for i in 1 2 3 4 5; do
            gh release upload "${TAG}" manifest.json --clobber && break
            if [ $i -eq 5 ]; then exit 1; fi
            echo "Attempt ${i}: release not ready, retrying in 30s..."
            sleep 30
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

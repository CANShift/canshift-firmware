name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Read firmware version
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Check if release already exists
        id: check
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "should_release=false" >> $GITHUB_OUTPUT
            echo "Release ${{ steps.ver.outputs.tag }} already exists — skipping."
          else
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "New version ${{ steps.ver.outputs.tag }} — will release."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  set-matrix:
    name: Resolve board matrix
    needs: [check-version]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.read.outputs.boards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: read
        run: echo "boards=$(jq -c '[.[].id]' .github/boards.json)" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create draft release
    needs: [check-version]
    if: needs.check-version.outputs.should_release == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Create GitHub Release if missing
        run: |
          TAG=${{ needs.check-version.outputs.tag }}
          if ! gh release view "${TAG}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release create "${TAG}" \
              --repo "${{ github.repository }}" \
              --title "${TAG}" \
              --notes "Firmware-only release. See README.md for the bundled changes." \
              --draft
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Flag 0.x releases as pre-release
        if: startsWith(needs.check-version.outputs.tag, 'v0.')
        run: gh release edit "${{ needs.check-version.outputs.tag }}" --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  firmware-release:
    name: Firmware — build & attach
    needs: [check-version, set-matrix, create-release]
    if: needs.check-version.outputs.should_release == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.set-matrix.outputs.boards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Cache PlatformIO packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.platformio/.packages
            ~/.platformio/.cache
          key: platformio-${{ runner.os }}-${{ matrix.board }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            platformio-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup
            rust/target
          key: rust-release-${{ runner.os }}-${{ hashFiles('rust/**/Cargo.toml', 'rust/**/Cargo.lock') }}
          restore-keys: rust-release-${{ runner.os }}-

      - name: Install espup + esp32 Rust toolchain
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if ! command -v espup >/dev/null; then
            cargo install espup --locked
          fi
          espup install --targets esp32
          . ~/export-esp.sh
          echo "LIBCLANG_PATH=$LIBCLANG_PATH" >> "$GITHUB_ENV"
          for dir in $(echo "$PATH" | tr ':' '\n' | grep -E '(esp|rustup)' || true); do
            echo "$dir" >> "$GITHUB_PATH"
          done

      - name: Install PlatformIO CLI
        run: pip install platformio

      - name: Build production firmware (${{ matrix.board }})
        run: platformio run -e "${{ matrix.board }}"

      - name: Assert APP_VERSION_STR was injected into firmware binary
        run: |
          VERSION=${{ needs.check-version.outputs.version }}
          ELF=.pio/build/${{ matrix.board }}/firmware.elf
          # The boot banner LOG_INFO is compiled out in prod (APP_LOG_LEVEL=1)
          # so we can't rely on its string. The splash label literal
          # `"v" APP_VERSION_STR` in boot_sequence.cpp survives because it's a
          # plain string passed to lv_label_set_text. Use the explicit `0.0.0-unset`
          # fallback as the negative signal — if it appears, the macro wasn't
          # injected.
          if strings "$ELF" | grep -qF "0.0.0-unset"; then
            echo "::error::APP_VERSION_STR fell back to 0.0.0-unset in $ELF"
            echo "extra_targets.py likely failed to inject the macro into projenv."
            strings "$ELF" | grep -E "v[0-9]+\.[0-9]+\.[0-9]+|0\.0\.0-unset" | head -10
            exit 1
          fi
          if ! strings "$ELF" | grep -qF "v${VERSION}"; then
            echo "::error::APP_VERSION_STR mismatch — no 'v${VERSION}' literal in $ELF"
            strings "$ELF" | grep -E "v[0-9]+\.[0-9]+\.[0-9]+|0\.0\.0-unset" | head -10
            exit 1
          fi
          echo "APP_VERSION_STR=v${VERSION} confirmed in firmware ELF."

      - name: Build SPIFFS image
        run: platformio run --target buildfs -e "${{ matrix.board }}"

      - name: Stage release assets (firmware partition, merged image, SPIFFS)
        run: |
          TAG=${{ needs.check-version.outputs.tag }}
          BOARD=${{ matrix.board }}
          CHIP=$(jq -r --arg id "$BOARD" '.[] | select(.id == $id) | .chip' .github/boards.json)
          pip install esptool
          # Merged factory image — USB esptool flashing only (bootloader + partitions + firmware).
          python -m esptool --chip "$CHIP" merge_bin \
            -o "canshift-${BOARD}-${TAG}-merged.bin" \
            0x1000 ".pio/build/${BOARD}/bootloader.bin" \
            0x8000 ".pio/build/${BOARD}/partitions.bin" \
            0x10000 ".pio/build/${BOARD}/firmware.bin"
          # Firmware-partition image — what mobile / studio OTA must consume.
          cp ".pio/build/${BOARD}/firmware.bin" "canshift-${BOARD}-${TAG}-firmware.bin"
          # SPIFFS image — flashed to the data partition.
          cp ".pio/build/${BOARD}/spiffs.bin" "canshift-${BOARD}-${TAG}-spiffs.bin"

      - name: Sign firmware artifacts with Ed25519
        run: |
          if [ -z "${FIRMWARE_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::warning::FIRMWARE_SIGNING_PRIVATE_KEY repo secret not set —"
            echo "::warning::skipping .sig generation. Set the secret before the flasher"
            echo "::warning::starts enforcing signature verification (#1259)."
            exit 0
          fi
          TAG=${{ needs.check-version.outputs.tag }}
          BOARD=${{ matrix.board }}
          pip install --quiet cryptography
          python3 scripts/sign_release_artifacts.py \
            "canshift-${BOARD}-${TAG}-merged.bin" \
            "canshift-${BOARD}-${TAG}-firmware.bin" \
            "canshift-${BOARD}-${TAG}-spiffs.bin"
        env:
          FIRMWARE_SIGNING_PRIVATE_KEY: ${{ secrets.FIRMWARE_SIGNING_PRIVATE_KEY }}

      - name: Attach firmware, OTA partition image and SPIFFS to GitHub Release
        run: |
          TAG=${{ needs.check-version.outputs.tag }}
          BOARD=${{ matrix.board }}
          MERGED="canshift-${BOARD}-${TAG}-merged.bin"
          OTA="canshift-${BOARD}-${TAG}-firmware.bin"
          FS="canshift-${BOARD}-${TAG}-spiffs.bin"
          # Ed25519 signatures land alongside their .bin when the signing key
          # is configured (#1259). They are append-only assets so we glob
          # rather than name them explicitly — the workflow stays compatible
          # with the pre-signing world while the rollout completes.
          SIGS=()
          for f in "${MERGED}.sig" "${OTA}.sig" "${FS}.sig"; do
            [ -f "${f}" ] && SIGS+=("${f}")
          done
          for i in 1 2 3 4 5; do
            gh release upload "${TAG}" "${MERGED}" "${OTA}" "${FS}" "${SIGS[@]}" --clobber && break
            if [ $i -eq 5 ]; then exit 1; fi
            echo "Attempt ${i}: release not ready, retrying in 30s..."
            sleep 30
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  manifest:
    name: Publish board manifest
    needs: [check-version, firmware-release]
    if: needs.check-version.outputs.should_release == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download release binaries
        run: |
          TAG=${{ needs.check-version.outputs.tag }}
          mkdir -p dist
          for i in 1 2 3 4 5; do
            gh release download "${TAG}" --dir dist --pattern 'canshift-*.bin' --clobber && break
            if [ $i -eq 5 ]; then exit 1; fi
            echo "Attempt ${i}: assets not ready, retrying in 30s..."
            sleep 30
          done
          ls -l dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Build manifest.json
        run: |
          TAG=${{ needs.check-version.outputs.tag }}
          VERSION=${{ needs.check-version.outputs.version }}
          ( cd dist && sha256sum *.bin ) \
            | jq -R -s 'split("\n")
                        | map(select(length > 0) | split("  "))
                        | map({ key: .[1], value: .[0] })
                        | from_entries' > sums.json
          jq --arg tag "$TAG" --arg version "$VERSION" --slurpfile sums sums.json '
            ($sums[0]) as $s |
            {
              schema: 2,
              version: $version,
              tag: $tag,
              boards: [
                .[] | . as $b | {
                  id, chip, display, touch,
                  artifacts: (
                    ["merged", "firmware", "spiffs"]
                    | map(. as $kind
                        | ("canshift-\($b.id)-\($tag)-\($kind).bin") as $file
                        | { key: $kind, value: { file: $file, sha256: ($s[$file] // null) } })
                    | from_entries
                  )
                }
              ]
            }' .github/boards.json > manifest.json
          cat manifest.json

      - name: Attach manifest.json to GitHub Release
        run: |
          TAG=${{ needs.check-version.outputs.tag }}
          for i in 1 2 3 4 5; do
            gh release upload "${TAG}" manifest.json --clobber && break
            if [ $i -eq 5 ]; then exit 1; fi
            echo "Attempt ${i}: release not ready, retrying in 30s..."
            sleep 30
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
